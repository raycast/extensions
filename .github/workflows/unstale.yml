# Removes the "status: stalled" label the moment a stalled PR gets a new comment or push,
# so contributors get immediate feedback instead of waiting for the next scheduled stale scan.
#
# The job-level `if` means the runner is never even started for events on PRs that
# aren't stalled, which is the vast majority of them.
name: Un-stale PR on activity

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [synchronize, reopened]

permissions:
  pull-requests: write

jobs:
  unstale:
    runs-on: ubuntu-latest
    if: >-
      github.repository == 'raycast/extensions' &&
      (
        contains(github.event.pull_request.labels.*.name, 'status: stalled') ||
        (github.event.issue.pull_request && contains(github.event.issue.labels.*.name, 'status: stalled'))
      )
    steps:
      - name: Remove stalled label
        env:
          GH_TOKEN: ${{ secrets.RAYCAST_BOT_API_ACCESS_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: gh pr edit "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --remove-label "status: stalled"
