name: NPM - Check

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR to check"
        required: true
  pull_request:
    paths:
      - "extensions/**"
    branches: [main, master]

concurrency:
  # Keep manual runs apart from automatic ones so a manual run can't cancel the PR's own check.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

jobs:
  setup:
    name: Get Extensions
    # The Merge PR workflow pushes a maintenance commit right before merging. Don't re-check it.
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    outputs:
      extension_dirs: ${{ steps.get_changed_extensions_json.outputs.extension_dirs }}
      check_ref: ${{ steps.get_pr_number.outputs.check_ref }}
    steps:
      # A manual run starts from a branch (usually main), not the PR, so look up the PR's head
      # commit and check that everywhere.
      - name: Get PR number
        id: get_pr_number
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
        run: |
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "check_ref=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          else
            head_sha=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq .head.sha)
            echo "check_ref=$head_sha" >> "$GITHUB_OUTPUT"
          fi
      - name: Get changed extensions
        id: get_changed_extensions
        uses: raycast/github-actions/get-changed-extensions@v1.18.0
        with:
          pull_request_number: "${{ steps.get_pr_number.outputs.pr_number }}"
      - name: to JSON
        id: get_changed_extensions_json
        env:
          GH_TOKEN: ${{ github.token }}
          CHANGED_EXTENSIONS: ${{ steps.get_changed_extensions.outputs.paths }}
          CHECK_REF: ${{ steps.get_pr_number.outputs.check_ref }}
        run: |
          set -euo pipefail
          changed_extensions="$CHANGED_EXTENSIONS"
          repo_path="${GITHUB_WORKSPACE}/"
          # Remove the repository path from each path and convert to JSON array
          relative_paths=$(echo "$changed_extensions" | sed "s|$repo_path||g" | tr ',' '\n')
          # Keep only folders that exist at the commit being checked: a PR that deletes or renames an
          # extension lists the old folder too. No folders left gives [] and the check job is skipped.
          # A bad ref also returns 404 below, so make sure it exists first.
          gh api "repos/$GITHUB_REPOSITORY/commits/$CHECK_REF" --silent
          kept=""
          while IFS= read -r dir; do
            [[ -z "$dir" ]] && continue
            if out=$(gh api "repos/$GITHUB_REPOSITORY/contents/${dir%/}?ref=$CHECK_REF" --silent 2>&1); then
              kept+="$dir"$'\n'
            elif [[ "$out" == *"HTTP 404"* ]]; then
              echo "Skipping $dir: not in $CHECK_REF"
            else
              echo "::error::Couldn't check $dir at $CHECK_REF: $out"
              exit 1
            fi
          done <<< "$relative_paths"
          json_array=$(printf '%s' "$kept" | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "extension_dirs=$json_array" >> "$GITHUB_OUTPUT"
  check-extensions:
    name: ${{ matrix.extension_dir }}
    needs: setup
    if: needs.setup.outputs.extension_dirs != '[]'
    runs-on: macos-latest
    strategy:
      matrix:
        extension_dir: ${{ fromJson(needs.setup.outputs.extension_dirs) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.setup.outputs.check_ref }}
          sparse-checkout: ${{ matrix.extension_dir }}
      # Dependency checks are advisory; leave the test step's failure behavior unchanged.
      - name: Check extension
        continue-on-error: true
        working-directory: ${{ matrix.extension_dir }}
        run: |
          npm install -g npm-check
          # Retry once so a registry hiccup doesn't fail the check.
          npm ci || { echo "::warning::npm ci failed, retrying once..."; sleep 10; npm ci; }

          set +e
          npm-check
          EXIT_CODE=$?
          set -e

          if [ $EXIT_CODE -ne 0 ]; then
            echo "::warning::npm-check found issues in dependencies."
          fi
      - name: Test extension
        if: >-
          matrix.extension_dir == 'extensions/printer-status' || matrix.extension_dir == 'extensions/printer-status/' ||
          matrix.extension_dir == 'extensions/gif-search' || matrix.extension_dir == 'extensions/gif-search/' ||
          matrix.extension_dir == 'extensions/nba-game-viewer' || matrix.extension_dir == 'extensions/nba-game-viewer/' ||
          matrix.extension_dir == 'extensions/google-chrome-profiles' || matrix.extension_dir == 'extensions/google-chrome-profiles/' ||
          matrix.extension_dir == 'extensions/focus-modes' || matrix.extension_dir == 'extensions/focus-modes/'
        working-directory: ${{ matrix.extension_dir }}
        run: npm test
