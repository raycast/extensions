name: Update CODEOWNERs

on:
  push:
    paths:
      - "extensions/**/package.json"
    branches: [main, master]
  workflow_dispatch:

jobs:
  generate-codeowners-file:
    runs-on: ubuntu-latest
    steps:
      - name: Generate sparse-checkout file list using GitHub API
        run: |
          # Get list of package.json files using GitHub API
          gh api repos/${{ github.repository }}/git/trees/main?recursive=1 \
            --jq '.tree[] | select(.path | test("^extensions/.*/package\\.json$")) | .path' \
            > .github/sparse-checkout-files.txt
          
          # Add required files
          echo scripts/generate-code-owners.js >> .github/sparse-checkout-files.txt
          echo .github/CODEOWNERS >> .github/sparse-checkout-files.txt
          echo .github/raycast2github.json >> .github/sparse-checkout-files.txt
          echo .github/extensionName2Folder.json >> .github/sparse-checkout-files.txt
          
          # Sort and deduplicate
          sort -u .github/sparse-checkout-files.txt -o .github/sparse-checkout-files.txt
          
          echo "Files to checkout:"
          cat .github/sparse-checkout-files.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload sparse-checkout file list
        uses: actions/upload-artifact@v4
        with:
          name: sparse-checkout-files
          path: .github/sparse-checkout-files.txt

  update:
    needs: generate-codeowners-file
    runs-on: ubuntu-latest
    if: github.repository == 'raycast/extensions'
    steps:
      - name: Download sparse-checkout file list
        uses: actions/download-artifact@v4
        with:
          name: sparse-checkout-files
          path: .github
      - name: Checkout with minimal sparse checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          sparse-checkout: |
            scripts/
            .github/
            extensions/
      - name: Apply specific file filter
        run: |
          git sparse-checkout set --no-cone
          git sparse-checkout set $(cat .github/sparse-checkout-files.txt)
          # Force update working directory
          git read-tree -m -u HEAD
          
          # Show what we actually have
          echo "Files actually checked out:"
          find . -type f -name "*.json" | head -20
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.15.1
      - name: Generate
        working-directory: scripts
        run: ./generate-code-owners.js
        env:
          PUBLISHING_BOT_TOKEN: ${{ secrets.RAYCAST_CLI_ACCESS_TOKEN }}
      - name: Set SHORT_SHA
        run: echo "SHORT_SHA=$(echo $GITHUB_SHA | cut -c1-8)" >> $GITHUB_ENV
      - name: Commit
        uses: raycast/github-actions/git-commit@master
        with:
          repo_dir: ${{ github.workspace }}
          message: "Update CODEOWNERS (${{ env.SHORT_SHA }})"
      - name: Notify Failure to Slack
        if: failure()
        uses: raycast/github-actions/slack-send@master
        with:
          webhook: ${{ secrets.SLACK_RELEASE_CHANNEL_WEBHOOK_URL }}
          color: "danger"
          text: |
            :no_entry_sign: ${env.GITHUB_WORKFLOW} has failed for commit ${{ env.SHORT_SHA }}
            <${env.GITHUB_SERVER_URL}/${env.GITHUB_REPOSITORY}/actions/runs/${env.GITHUB_RUN_ID}|Action logs> | <${env.GITHUB_SERVER_URL}/${env.GITHUB_REPOSITORY}/commit/${ env.GITHUB_SHA }|Commit: ${ env.SHORT_SHA }>
