name: Pull Request - Merge

concurrency:
  group: pull_request_merge_queue
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to merge"
        required: true

jobs:
  require_admin_or_write_approval:
    runs-on: ubuntu-latest
    name: Require admin/write approval
    env:
      GITHUB_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
    steps:
      - name: Verify PR has admin/write approval
        id: check
        shell: bash
        run: |
          set -euo pipefail

          pr_number="${{ inputs.pr_number }}"
          repo="${{ github.repository }}"

          echo "Checking reviews for PR #$pr_number in $repo"

          reviews_json=$(gh api --paginate "repos/$repo/pulls/$pr_number/reviews" | jq -s 'add')

          approved_users=$(echo "$reviews_json" | jq -r '
            sort_by(.submitted_at)
            | group_by(.user.login)
            | map(last)
            | map(select(.state == "APPROVED"))
            | .[].user.login
          ')

          if [[ -z "$approved_users" ]]; then
            echo "No effective approvals found."
            exit 1
          fi

          qualified_approver=""
          while IFS= read -r user; do
            [[ -z "$user" ]] && continue

            if ! permission=$(gh api "repos/$repo/collaborators/$user/permission" --jq '.permission' 2>/dev/null); then
              echo "$user is not a collaborator, skipping"
              continue
            fi

            echo "$user has permission: $permission"

            if [[ "$permission" == "admin" || "$permission" == "write" ]]; then
              qualified_approver="$user"
              break
            fi
          done <<< "$approved_users"

          if [[ -z "$qualified_approver" ]]; then
            echo "PR must be approved by at least one user with admin or write access."
            exit 1
          fi

          echo "Approval requirement satisfied by: $qualified_approver"

  merge:
    needs: require_admin_or_write_approval
    runs-on: macos-26
    name: Merge PR
    env:
      GITHUB_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
    steps:
      # Fail before pushing anything to the PR branch. Otherwise a draft or conflicting PR
      # gets a maintenance commit and then fails at the merge step anyway.
      - name: Check PR can be merged
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            pr_state=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json state,isDraft,mergeable)
            mergeable=$(jq -r .mergeable <<< "$pr_state")
            [[ "$mergeable" != "UNKNOWN" ]] && break
            echo "Mergeability not computed yet, retrying ($attempt/5)..."
            sleep 5
          done
          echo "$pr_state"

          if [[ $(jq -r .state <<< "$pr_state") != "OPEN" ]]; then
            echo "::error::PR #$PR_NUMBER is not open."
            exit 1
          fi
          if [[ $(jq -r .isDraft <<< "$pr_state") == "true" ]]; then
            echo "::error::PR #$PR_NUMBER is still a draft."
            exit 1
          fi
          if [[ "$mergeable" == "CONFLICTING" ]]; then
            echo "::error::PR #$PR_NUMBER has merge conflicts with the base branch."
            exit 1
          fi
          if [[ "$mergeable" != "MERGEABLE" ]]; then
            echo "::error::GitHub hasn't finished checking PR #$PR_NUMBER for conflicts. Run the merge again in a minute."
            exit 1
          fi
      - name: Setup GIT
        uses: raycast/github-actions/setup-git@v1.18.0
      - name: Get changed extensions
        id: get_changed_extensions
        uses: raycast/github-actions/get-changed-extensions@v1.18.0
        with:
          pull_request_number: "${{ inputs.pr_number }}"
      - name: Checkout PR
        run: gh pr checkout ${{ github.event.inputs.pr_number }}
      - name: Update CHANGELOG.md
        id: update_changelog
        run: |
          changelog_updated=false
          updated_count=0
          # The REST files list is paginated; `gh pr view --json files` stops at 100 files.
          changelogs=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/${{ github.event.inputs.pr_number }}/files" --jq '.[].filename' | grep -i CHANGELOG.md || true)
          for changelog in $changelogs
          do
            echo "$changelog:"
            if [[ -f "$changelog" ]]; then
              pattern="{PR_MERGE_DATE}"
              replacement=$(date '+%Y-%m-%d')
              if grep -q "$pattern" "$changelog"; then
                echo "  pattern found"
                sed -i "" "s/$pattern/$replacement/g" "$changelog"
                echo "  updated to $replacement"
                updated_count=$((updated_count+1))
              else
                echo "  pattern not found - skipping"
              fi
            else
              echo "  skipping (file not existing)"
            fi
          done
          if [[ $updated_count -gt 0 ]]; then
            changelog_updated=true
          fi
          echo "changelog_updated=$changelog_updated" >> "$GITHUB_OUTPUT"

      - name: Add platforms field to package.json
        id: add_platforms_field
        env:
          CHANGED_EXTENSIONS: ${{ steps.get_changed_extensions.outputs.paths }}
        run: |
          platforms_added=false
          modified_count=0
          changed_extensions="$CHANGED_EXTENSIONS"
          if [[ -n "$changed_extensions" ]]; then
            echo "Changed extensions: $changed_extensions"
            IFS=',' read -ra extension_paths <<< "$changed_extensions"
            for extension_path in "${extension_paths[@]}"; do
              package_json="$extension_path/package.json"
              echo "Checking: $package_json"
              if [[ -f "$package_json" ]]; then
                if ! jq -e '.platforms' "$package_json" > /dev/null 2>&1; then
                  echo "  Adding platforms field to $package_json"
                  jq '. + {"platforms": ["macOS"]}' "$package_json" > "${package_json}.tmp" && mv "${package_json}.tmp" "$package_json"
                  modified_count=$((modified_count+1))
                else
                  echo "  platforms field already exists in $package_json"
                fi
              else
                echo "  package.json not found in $extension_path"
              fi
            done
          else
            echo "No changed extensions found"
          fi
          if [[ $modified_count -gt 0 ]]; then
            platforms_added=true
          fi
          echo "platforms_added=$platforms_added" >> "$GITHUB_OUTPUT"

      - name: Optimise images
        id: optimise_images
        run: |
          images_optimized=false
          images=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/${{ github.event.inputs.pr_number }}/files" --jq '.[].filename | select(ascii_downcase | test("\\.(png|jpe?g)$"))')
          images_array=()
          if [[ -n "$images" ]]; then
            echo "Images: $images"
            while IFS= read -r image; do
              if [[ -f "$image" ]]; then
                images_array+=("$image")
              fi
            done <<< "$images"
          fi
          count=${#images_array[@]}
          echo "Found images: $count"
          if [ "$count" -gt 0 ]; then
            brew install oxipng jpegoptim

            # A file the optimiser can't read (wrong extension, corrupt) shouldn't block the merge.
            for image in "${images_array[@]}"; do
              echo "Processing: $image"
              image_lower=$(tr '[:upper:]' '[:lower:]' <<< "$image")
              if [[ "$image_lower" == *.png ]]; then
                oxipng -o 6 --strip safe "$image" || echo "::warning file=$image::Couldn't optimise this image, leaving it unchanged."
              fi
              if [[ "$image_lower" == *.jpg ]] || [[ "$image_lower" == *.jpeg ]]; then
                jpegoptim --max=85 --strip-all "$image" || echo "::warning file=$image::Couldn't optimise this image, leaving it unchanged."
              fi
            done

            images_optimized=true
          fi
          echo "images_optimized=$images_optimized" >> "$GITHUB_OUTPUT"

      - name: Commit changes
        id: commit_changes
        run: |
          pr_info=$(gh pr view ${{ github.event.inputs.pr_number }} --json headRefName,headRepository,headRepositoryOwner,maintainerCanModify,url)
          echo "$pr_info"

          can_modify=$(echo "$pr_info" | jq -r .maintainerCanModify)
          pr_branch=$(echo "$pr_info" | jq -r .headRefName)
          pr_repo_name=$(echo "$pr_info" | jq -r .headRepository.name)
          pr_repo_owner=$(echo "$pr_info" | jq -r .headRepositoryOwner.login)

          if ! [[ -z $(git status -s .) ]] ; then
            if [[ "$can_modify" == "false" ]]; then
              error="Edits from maintainers are disabled."
              echo "$error"
              echo "error=$error" >> "$GITHUB_OUTPUT"
              exit 1
            fi

            parts=()
            if [[ "${{ steps.update_changelog.outputs.changelog_updated }}" == "true" ]]; then
              parts+=("Update CHANGELOG.md")
            fi
            if [[ "${{ steps.add_platforms_field.outputs.platforms_added }}" == "true" ]]; then
              parts+=("add platforms field")
            fi
            if [[ "${{ steps.optimise_images.outputs.images_optimized }}" == "true" ]]; then
              parts+=("optimise images")
            fi

            if [[ ${#parts[@]} -eq 0 ]]; then
              commit_msg="Automated maintenance updates"
            else
              commit_msg="${parts[0]}"
              for (( i=1; i<${#parts[@]}; i++ )); do
                if [[ $i -eq $((${#parts[@]}-1)) ]]; then
                  commit_msg+=" and ${parts[$i]}"
                else
                  commit_msg+=", ${parts[$i]}"
                fi
              done
            fi

            git add .
            git status .
            git commit --message "$commit_msg"

            if ! git push https://${{ env.GITHUB_TOKEN }}@github.com/"$pr_repo_owner"/"$pr_repo_name".git HEAD:"$pr_branch"; then
              echo "::error::Couldn't push to $pr_repo_owner/$pr_repo_name. Either the author pushed new commits since this run started (run the merge again), or the PR comes from an organization-owned fork, which never accepts maintainer edits (ask the author to apply these changes or to open the PR from a personal fork)."
              exit 1
            fi
            echo "Pushed changes."
            echo "changes_pushed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No changes."
            echo "changes_pushed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Sleep for 30 seconds
        if: steps.commit_changes.outputs.changes_pushed == 'true'
        run: sleep 30
        shell: bash

      # --repo stops gh from switching the local checkout to main and pulling it after the merge,
      # which took up to 13 minutes on this repo while holding the merge queue.
      # --match-head-commit refuses the merge if the author pushed anything after this run checked out the PR.
      - name: Merge
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
        run: gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --squash --delete-branch --match-head-commit "$(git rev-parse HEAD)"

  notify_failure:
    needs:
      - require_admin_or_write_approval
      - merge
    if: always() && (needs.require_admin_or_write_approval.result == 'failure' || needs.merge.result == 'failure')
    runs-on: ubuntu-latest
    name: Notify Failure to Slack
    steps:
      - name: Notify Failure to Slack
        uses: raycast/github-actions/slack-send@v1.18.0
        with:
          webhook: ${{ secrets.SLACK_STREAM_ERRORS_STORE_PUBLIC }}
          color: "danger"
          text: |
            PR ${{ github.event.inputs.pr_number }} merge failed.
            Approval gate: ${{ needs.require_admin_or_write_approval.result }}
            Merge job: ${{ needs.merge.result }}
            Check <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|action logs>
