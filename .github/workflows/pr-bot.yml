name: PR Bot
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "extensions/**"
      - "docs/**"
    branches: [main, master]

jobs:
  pr-bot:
    if: github.repository == 'raycast/extensions'
    name: "PR Bot"
    runs-on: ubuntu-latest
    steps:
      - name: Get changed extensions
        id: get_changed_extensions
        uses: raycast/github-actions/get-changed-extensions@v1.18.0
        with:
          github_event_name: ${{ github.event_name }}

      # The step above can check out the PR's code into the workspace root, so run the bot from
      # a separate checkout of the default branch to never execute PR code with our secrets.
      - name: Checkout bot scripts
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: .bots
          sparse-checkout: scripts/bots
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .bots/.node-version
          cache: npm
          cache-dependency-path: .bots/scripts/bots/package-lock.json
      - name: Install bot dependencies
        working-directory: .bots/scripts/bots
        run: npm ci --omit=dev
      - name: Run bot
        working-directory: .bots/scripts/bots
        run: node run.ts pr-bot.ts
        env:
          GITHUB_ACCESS_TOKEN: ${{ secrets.RAYCAST_BOT_API_ACCESS_TOKEN }}
          CHANGED_EXTENSIONS: ${{ steps.get_changed_extensions.outputs.paths }}

      - name: Set SHORT_SHA
        if: always()
        run: echo "SHORT_SHA=${GITHUB_SHA::8}" >> "$GITHUB_ENV"

      - name: Notify Failure to Slack
        if: failure()
        uses: raycast/github-actions/slack-send@master
        with:
          webhook: ${{ secrets.SLACK_STREAM_ERRORS_STORE_PUBLIC }}
          color: "danger"
          text: |
            :no_entry_sign: ${{ github.workflow }} has failed
            <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|Action logs> | <${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}|Commit: ${{ env.SHORT_SHA }}>
