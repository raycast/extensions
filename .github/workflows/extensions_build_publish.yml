name: Extensions
run-name: "${{ github.event_name == 'push' && format('Publish: {0}', github.event.head_commit.message) || (github.event_name == 'pull_request' && format('Check: {0}', github.event.pull_request.title) || github.event_name == 'workflow_dispatch' && format('Manual: {0} {1}', inputs.command, inputs.paths) || format('Event: {0}', github.event_name) ) }}"

on:
  workflow_dispatch:
    inputs:
      paths:
        description: 'Extensions to update (comma-separated relative paths for extensions) or ("extensions/**"" to execute on all possible subdirectories)'
        required: true
      command:
        description: "Ray CLI command to run (build | publish)"
        default: "build"
        required: true
        type: choice
        options:
          - build
          - publish
      cli_version:
        description: 'CLI Version (optional, eg. "1.0.0")'
        required: false
  pull_request:
    paths:
      - "extensions/**"
    branches: [main, master]
  push:
    paths:
      - "extensions/**"
    branches: [main, master]

# Only PR checks are cancelled by a newer push. Publish and manual runs always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  extensions_build_publish:
    # Skip PR checks for the maintenance commit the Merge PR workflow pushes right before merging.
    if: github.repository == 'raycast/extensions' && !(github.event_name == 'pull_request' && github.actor == 'github-actions[bot]')
    name: "${{ github.event_name == 'push' && 'Publish' || (github.event_name == 'pull_request' && 'Check' || github.event_name == 'workflow_dispatch' && inputs.command || github.event_name ) }}"
    runs-on: macos-26
    steps:
      - name: Setup Xcode
        uses: raycast/github-actions/setup-xcode@xcode-26.4.x
      # Read the two .github files this job needs through the API. A git checkout here fetched the
      # whole repo tree a second time (the Ray CLI action fetches it again) and took up to 15 minutes.
      # PR checks read them from the base commit so a PR can't change the rules it is checked against.
      - name: Load Ray CLI config
        id: allow_owners_only_for_extensions
        env:
          GH_TOKEN: ${{ github.token }}
          CONFIG_REF: ${{ github.event.pull_request.base.sha || github.sha }}
        run: |
          set -euo pipefail
          read_file() {
            local attempt
            for attempt in 1 2 3; do
              if gh api -H "Accept: application/vnd.github.raw+json" \
                "repos/$GITHUB_REPOSITORY/contents/$1?ref=$CONFIG_REF" > "$2"; then
                return 0
              fi
              echo "Couldn't read $1, retrying ($attempt/3)..." >&2
              sleep 5
            done
            echo "::error::Couldn't read $1 at $CONFIG_REF."
            return 1
          }

          # Shows the problems found while validating the extensions in the PR diff.
          read_file .github/ray.matcher.json "$RUNNER_TEMP/ray.matcher.json"
          echo "##[add-matcher]$RUNNER_TEMP/ray.matcher.json"

          # Required: an empty list would let anyone change owners-only extensions.
          read_file .github/public_raycast_extensions.txt "$RUNNER_TEMP/public_raycast_extensions.txt"
          if ! LC_ALL=C grep -q '[^[:space:]]' "$RUNNER_TEMP/public_raycast_extensions.txt"; then
            echo "::error::.github/public_raycast_extensions.txt at $CONFIG_REF is empty or contains only whitespace."
            exit 1
          fi
          {
            echo "value<<EOF"
            printf '%s\n' "$(cat "$RUNNER_TEMP/public_raycast_extensions.txt")"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Run Ray CLI
        id: ray_cli
        uses: raycast/github-actions/ray@v1.18.0
        with:
          access_token: "${{ secrets.RAYCAST_CLI_ACCESS_TOKEN }}"
          command: "${{ github.event.inputs.command }}"
          paths: "${{ github.event.inputs.paths }}"
          cli_version: "${{ github.event.inputs.cli_version }}"
          allow_owners_only_for_extensions: "${{ steps.allow_owners_only_for_extensions.outputs.value }}"
      - name: Post Store URLs
        if: github.event_name == 'push'
        uses: raycast/github-actions/git-post-store-urls-to-pr@v1.18.0
        with:
          store_urls: ${{ steps.ray_cli.outputs.store_urls }}
          github_token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
      - name: Reward Contributor
        uses: actions/github-script@v9
        if: github.event_name == 'push'
        env:
          PUBLISHING_BOT_TOKEN: ${{ secrets.RAYCAST_CLI_ACCESS_TOKEN }}
        with:
          github-token: ${{ secrets.RAYCAST_BOT_API_ACCESS_TOKEN }}
          script: |
            const result = await github.rest.repos.getContent({
              mediaType: {
                format: "raw",
              },
              owner: context.repo.owner,
              repo: context.repo.repo,
              path: "scripts/reward.js",
            });

            require('fs').writeFileSync('./reward.js', result.data);

            const script = require('./reward')
            await script({
              github,
              context,
              fetch,
            })
      - name: Set SHORT_SHA
        if: always()
        run: echo "SHORT_SHA=${GITHUB_SHA::8}" >> "$GITHUB_ENV"

      - name: Notify Failure to Slack
        if: failure() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: raycast/github-actions/slack-send@v1.18.0
        with:
          webhook: ${{ github.event_name == 'workflow_dispatch' && secrets.SLACK_RELEASE_CHANNEL_WEBHOOK_URL || secrets.SLACK_STREAM_ERRORS_STORE_PUBLIC }}
          color: "danger"
          text: |
            :no_entry_sign: ${{ github.workflow }} has failed
            <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|Action logs> | <${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}|Commit: ${{ env.SHORT_SHA }}>
      - name: Notify Success to Slack
        if: success() && github.event_name == 'workflow_dispatch'
        uses: raycast/github-actions/slack-send@v1.18.0
        with:
          webhook: ${{ secrets.SLACK_RELEASE_CHANNEL_WEBHOOK_URL }}
          color: "good"
          text: |
            :white_check_mark: ${{ github.workflow }} has succeeded
            <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|Action logs> | <${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}|Commit: ${{ env.SHORT_SHA }}>
