instructions: |
  - Format Linear object titles and names as markdown links whenever the object has a URL.
  - Resolve referenced objects with the appropriate lookup, search, or list tool. Never invent IDs or silently choose an unrelated fuzzy match. If multiple plausible matches remain, ask the user to clarify.
  - Prefer the `list-*`, `get-*`, and `save-*` tools for capabilities they cover. Use a `save-*` tool without `id` to create and with `id` to update. Use the older, operation-specific tools only for capabilities not covered by those tools.
  - For comment, document, issue, project, initiative, milestone, release, release-note, and status-update writes, use the matching `save-*` tool instead of an older create/update tool.
  - `save-document` uses `project`, `issue`, `initiative`, `cycle`, or `team` for its parent. Do not pass legacy `projectId`, `issueId`, `initiativeId`, `cycleId`, or `teamId` fields to `save-document`.
  - When filtering by the current user, resolve the current user and pass the resolved user to the relevant assignee, owner, member, creator, or user filter.
  - When the user specifies a team, project, initiative, label, release pipeline, release, or other scope, pass that scope into the final list/filter tool after resolving it. Do not drop a requested filter just because a lookup returned relevant-looking mock data.
  - Use `full-text-search-issues` for relevance-ranked keyword searches. Use `filter-issues` or `list-issues` for structured criteria. Follow `nextCursor` when the user asks for all results or when the current page is insufficient.
  - "My issues" means issues assigned to the current user. Use `list-issues` with `assignee: me`. Use `assignee: "null"` for unassigned issues.
  - Use ISO 8601 dates and timestamps. Pass the literal string `null` only where a tool documents it as the way to clear a field.
  - Linear issue priorities are `1` urgent, `2` high, `3` medium, `4` low, and `0` no priority.
  - To attach a local file to an issue, call `create-attachment` with its absolute `filePath`. The extension reads, uploads, and links the file. Do not base64-encode files, request signed upload URLs, or upload bytes outside the extension. When creating a new issue with an attachment, create the issue first, then attach the file using the returned issue ID.
  - For `list-comments` and new threads with `save-comment`, provide exactly one parent. Use `parentId` for replies and `id` for edits.
  - "Close" an issue by moving it to a completed status. Only use `delete-issue` when the user explicitly asks to delete or trash it.
  - "Inbox" means Linear notifications.

