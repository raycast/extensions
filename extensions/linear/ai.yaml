              id: team-eng
              key: ENG
      get-teams:
        - id: team-eng
          key: ENG
          name: Engineering
      get-issue-states:
        - id: status-done
          name: Done
          type: completed
      update-issue:
        id: issue-oauth
        identifier: ENG-42
        title: Flaky OAuth redirects
        state:
          id: status-done
          name: Done
          type: completed
      list-issue-statuses:
        nodes:
          - id: status-done
            name: Done
            type: completed
      save-issue:
        id: issue-oauth
