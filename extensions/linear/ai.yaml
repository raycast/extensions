instructions: |
  - Format Linear object titles and names as markdown links whenever the object has a URL.
  - Never invent IDs or silently choose an unrelated fuzzy match. If multiple plausible matches remain, ask the user to clarify.
  - Use a `save-*` tool without `id` to create and with `id` to update. Writes for comments, documents, issues, projects, initiatives, milestones, releases, release notes, and status updates all go through the matching `save-*` tool.
  - Most inputs that reference another object accept a name, key, identifier, slug, or ID, so pass what the user said (for example `team: ENG`) instead of looking up an ID first. Look objects up only to disambiguate or when the user asks to see them.
  - Scope inputs on list tools are optional unless a tool's schema requires them. Call `list-teams`, `list-users`, `list-cycles`, `list-issue-statuses`, and `list-milestones` without arguments to list across the workspace. Pass `team` to `list-issue-statuses` before using a status ID in a write, because statuses are team-specific.
  - Use `get-user` with `query: me` for the current user and `list-users` for workspace members. Use `list-teams` for teams; it has no "my teams" filter, so describe results as workspace teams.
  - `save-document` uses `project`, `issue`, `initiative`, `cycle`, or `team` for its parent. Do not pass legacy `projectId`, `issueId`, `initiativeId`, `cycleId`, or `teamId` fields to `save-document`.
  - When filtering by the current user, pass `me` where a filter accepts it; otherwise resolve the current user with `get-user` and pass the resolved user.
  - When the user specifies a team, project, initiative, label, release pipeline, release, or other scope, pass that scope into the final list/filter tool after resolving it. Do not drop a requested filter just because a lookup returned relevant-looking mock data.
  - Use `list-issues` for structured issue queries. Use `full-text-search-issues` for relevance-ranked topic or phrase searches. Use `filter-issues` only for criteria `list-issues` cannot express, such as priority or date ranges, estimates, or OR conditions. Follow `nextCursor` when the user asks for all results or when the current page is insufficient.
  - "My issues" means issues assigned to the current user. Use `list-issues` with `assignee: me`. Use `assignee: "null"` for unassigned issues.
  - `list-issues` accepts a status name or type in `state` (for example `In Progress` or `started`) and, without `team`, matches it in every team. Do not look up statuses or split the query per team first.
  - Use ISO 8601 dates and timestamps. Pass the literal string `null` only where a tool documents it as the way to clear a field.
  - Linear issue priorities are `1` urgent, `2` high, `3` medium, `4` low, and `0` no priority.
  - To attach a local file to an issue, call `create-attachment` with its absolute `filePath`. The extension reads, uploads, and links the file. Do not base64-encode files, request signed upload URLs, or upload bytes outside the extension. When creating a new issue with an attachment, create the issue first, then attach the file using the returned issue ID.
  - To add or remove a single label without touching the others, use `add-label` or `remove-label`. Passing `labels` to `save-issue` replaces the whole set.
  - For `list-comments` and new threads with `save-comment`, provide exactly one parent. Use `parentId` for replies and `id` for edits.
  - "Close" an issue by moving it to a completed status. Only use `delete-issue` when the user explicitly asks to delete or trash it.
  - "Inbox" means Linear notifications. Use `get-notifications` with `unreadOnly: true` for unread notifications.

