<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>App Icons Finder — Raycast store mock</title>
  <style>
    :root {
      --forest: #0a5340;
      --forest-deep: #073c2e;
      --cream: #f7f2e8;
      --gold: #e8b02f;
      --ray-bg: rgba(32, 32, 34, 0.92);
      --ray-text: #f5f5f7;
      --ray-sub: #a1a1a6;
      --ray-sel: rgba(10, 83, 64, 0.55);
      --ray-border: rgba(255,255,255,0.08);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif; background: #000; color: var(--ray-text); }
    #frame {
      width: 2000px; height: 1250px; position: relative; overflow: hidden;
      background:
        radial-gradient(ellipse at 18% 22%, rgba(232, 176, 47, 0.22), transparent 42%),
        radial-gradient(ellipse at 82% 78%, rgba(247, 242, 232, 0.12), transparent 46%),
        linear-gradient(155deg, #0c6650 0%, var(--forest) 38%, var(--forest-deep) 100%);
    }
    .brand { position: absolute; left: 72px; bottom: 56px; display: flex; align-items: center; gap: 14px; color: rgba(247, 242, 232, 0.72); font-size: 22px; font-weight: 600; }
    .brand-mark { width: 44px; height: 44px; border-radius: 12px; background: linear-gradient(145deg, rgba(247,242,232,0.18), transparent), var(--forest-deep); border: 1px solid rgba(247,242,232,0.25); display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 8px; }
    .brand-mark i { display: block; border-radius: 5px; background: var(--cream); }
    .brand-mark i:last-child { background: var(--gold); }
    .caption { position: absolute; left: 72px; top: 64px; max-width: 540px; color: var(--cream); }
    .caption .kicker { margin: 0 0 10px; text-transform: uppercase; letter-spacing: 0.08em; font-size: 14px; font-weight: 700; color: var(--gold); }
    .caption h1 { margin: 0 0 12px; font-size: 42px; line-height: 1.1; letter-spacing: -0.03em; font-weight: 700; }
    .caption p { margin: 0; font-size: 20px; line-height: 1.45; color: rgba(247, 242, 232, 0.78); }
    .raycast { position: absolute; left: 50%; top: 54%; transform: translate(-50%, -50%); width: 860px; height: 620px; border-radius: 18px; background: var(--ray-bg); backdrop-filter: blur(28px); -webkit-backdrop-filter: blur(28px); box-shadow: 0 40px 90px rgba(0,0,0,0.38), 0 0 0 1px rgba(255,255,255,0.08), inset 0 1px 0 rgba(255,255,255,0.08); display: flex; flex-direction: column; overflow: hidden; }
    .search { display: flex; align-items: center; gap: 12px; padding: 18px 20px 14px; border-bottom: 1px solid var(--ray-border); }
    .search-icon { width: 22px; height: 22px; opacity: 0.7; flex: none; }
    .search-input { flex: 1; min-width: 0; font-size: 22px; font-weight: 500; color: var(--ray-text); }
    .search-input .placeholder { color: var(--ray-sub); font-weight: 450; }
    .region { display: inline-flex; align-items: center; gap: 8px; height: 32px; padding: 0 12px; border-radius: 8px; background: rgba(255,255,255,0.06); color: var(--ray-sub); font-size: 13px; font-weight: 500; flex: none; }
    .region svg { width: 12px; height: 12px; opacity: 0.8; }
    .body { flex: 1; min-height: 0; padding: 14px 16px 18px; overflow: hidden; position: relative; }
    .section-title { margin: 2px 8px 10px; color: var(--ray-sub); font-size: 12px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; }
    .grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px 8px; }
    .item { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 10px 6px 12px; border-radius: 14px; min-width: 0; }
    .item.selected { background: var(--ray-sel); box-shadow: inset 0 0 0 1px rgba(232, 176, 47, 0.35); }
    .thumb { width: 92px; height: 92px; border-radius: 22%; background: #1f1f21; overflow: hidden; box-shadow: 0 8px 18px rgba(0,0,0,0.28); display: grid; place-items: center; }
    .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .thumb.suggest, .thumb.recent { background: rgba(255,255,255,0.06); font-size: 30px; }
    .name { width: 100%; text-align: center; font-size: 12px; line-height: 1.25; color: var(--ray-sub); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 2.5em; }
    .item.selected .name { color: var(--ray-text); font-weight: 600; }
    .actions { position: absolute; right: 28px; bottom: 28px; width: 280px; border-radius: 14px; background: rgba(44, 44, 46, 0.96); box-shadow: 0 18px 40px rgba(0,0,0,0.4), 0 0 0 1px rgba(255,255,255,0.08); overflow: hidden; padding: 8px; }
    .action { display: flex; align-items: center; gap: 12px; padding: 11px 12px; border-radius: 10px; font-size: 14px; font-weight: 500; color: var(--ray-text); }
    .action.primary { background: rgba(10, 83, 64, 0.85); }
    .action .shortcut { margin-left: auto; color: var(--ray-sub); font-size: 12px; font-weight: 500; }
    .action-icon { width: 18px; height: 18px; opacity: 0.9; }
    .toast { position: absolute; left: 50%; bottom: 26px; transform: translateX(-50%); display: inline-flex; align-items: center; gap: 10px; padding: 12px 16px; border-radius: 12px; background: rgba(28,28,30,0.95); box-shadow: 0 12px 30px rgba(0,0,0,0.35), 0 0 0 1px rgba(255,255,255,0.08); font-size: 14px; font-weight: 600; color: var(--ray-text); white-space: nowrap; }
    .toast .dot { width: 10px; height: 10px; border-radius: 50%; background: #34c759; box-shadow: 0 0 0 3px rgba(52,199,89,0.2); }
    .accent-0 { color: #64d2ff; } .accent-1 { color: #30d158; } .accent-2 { color: #ff9f0a; }
    .accent-3 { color: #bf5af2; } .accent-4 { color: #ff453a; } .accent-5 { color: #ffd60a; }
  </style>
</head>
<body>
  <div id="frame">
    <div class="caption">
      <p class="kicker">Uwarp · App Icons Finder</p>
      <h1 id="headline">Search App Store icons</h1>
      <p id="subhead">Browse official artwork, switch regions, download PNG or copy image.</p>
    </div>
    <div class="raycast" id="raycast">
      <div class="search">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <div class="search-input" id="query"><span class="placeholder">Search apps…</span></div>
        <div class="region"><span id="region-label">United States</span>
          <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 4.5L6 7.5L9 4.5"/></svg>
        </div>
      </div>
      <div class="body" id="body"></div>
    </div>
    <div class="brand">
      <div class="brand-mark"><i></i><i></i><i></i><i></i></div>
      <span>Uwarp · Design Tools</span>
    </div>
  </div>
  <script>
    const scene = window.__SCENE__ || {};
    const captions = {
      idle: { headline: 'Start from suggestions', subhead: 'Idle grid with recent searches and popular apps — ready before you type.' },
      results: { headline: 'Browse official icons', subhead: 'Search results show App Store artwork with publisher names and a region switch.' },
      actions: { headline: 'Download or copy PNG', subhead: 'Primary actions save to ~/Downloads or copy the image for design tools.' }
    };
    const cap = captions[scene.scene] || captions.results;
    document.getElementById('headline').textContent = cap.headline;
    document.getElementById('subhead').textContent = cap.subhead;
    document.getElementById('region-label').textContent = scene.region || 'United States';
    const queryEl = document.getElementById('query');
    if (scene.query) queryEl.textContent = scene.query;

    const body = document.getElementById('body');
    const accents = ['accent-0','accent-1','accent-2','accent-3','accent-4','accent-5'];
    const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

    if (scene.scene === 'idle') {
      const frag = document.createDocumentFragment();
      if (scene.recent?.length) {
        const st = document.createElement('div'); st.className = 'section-title'; st.textContent = 'Recent'; frag.appendChild(st);
        const g = document.createElement('div'); g.className = 'grid';
        scene.recent.forEach(term => {
          const el = document.createElement('div'); el.className = 'item';
          el.innerHTML = `<div class="thumb recent">⏱</div><div class="name">${esc(term)}</div>`;
          g.appendChild(el);
        });
        frag.appendChild(g);
      }
      const st2 = document.createElement('div'); st2.className = 'section-title'; st2.textContent = 'Try'; st2.style.marginTop = '12px'; frag.appendChild(st2);
      const g2 = document.createElement('div'); g2.className = 'grid';
      (scene.suggestions || []).forEach((term, i) => {
        const el = document.createElement('div'); el.className = 'item';
        el.innerHTML = `<div class="thumb suggest ${accents[i % accents.length]}">▦</div><div class="name">${esc(term)}</div>`;
        g2.appendChild(el);
      });
      frag.appendChild(g2);
      body.appendChild(frag);
    } else {
      const g = document.createElement('div'); g.className = 'grid';
      (scene.apps || []).slice(0, 10).forEach((app, i) => {
        const el = document.createElement('div');
        el.className = 'item' + (i === (scene.selectedIndex || 0) ? ' selected' : '');
        el.innerHTML = `<div class="thumb"><img src="${app.artworkUrl}" alt="" /></div><div class="name">${esc(app.trackName)}</div>`;
        g.appendChild(el);
      });
      body.appendChild(g);
      if (scene.scene === 'actions') {
        const actions = document.createElement('div'); actions.className = 'actions';
        actions.innerHTML = `
          <div class="action primary">
            <svg class="action-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M5 21h14"/></svg>
            Download PNG<span class="shortcut">↵</span>
          </div>
          <div class="action">
            <svg class="action-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M4 16V6a2 2 0 0 1 2-2h10"/></svg>
            Copy Image<span class="shortcut">⇧⌘C</span>
          </div>`;
        body.appendChild(actions);
        if (scene.toast) {
          const toast = document.createElement('div'); toast.className = 'toast';
          toast.innerHTML = `<span class="dot"></span>${esc(scene.toast)}`;
          document.getElementById('raycast').appendChild(toast);
        }
      }
    }
  </script>
</body>
</html>
