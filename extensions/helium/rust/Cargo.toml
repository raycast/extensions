[package]
name = "helium-windows"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "helium-windows"
path = "src/main.rs"

[dependencies]
raycast-rust-macros = { git = "https://github.com/raycast/extensions-rust-tools", rev = "c7a3cb2", package = "raycast-rust-macros" }
raycast-rust-runtime = { git = "https://github.com/raycast/extensions-rust-tools", rev = "c7a3cb2", package = "raycast-rust-runtime" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
  "Win32_Foundation", "Win32_System_Com", "Win32_System_Threading",
  "Win32_UI_Accessibility", "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse", "Win32_Security", "Win32_Graphics_Gdi"
] }
