<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <title>App Freezer</title>
  <desc>The native App Freezer menu-bar PNG mark on a system-blue background.</desc>
  <defs>
    <mask id="native-mark" x="103.5" y="76" width="305" height="360" maskUnits="userSpaceOnUse" style="mask-type: alpha">
      <image href="menu-bar-mark.png" x="103.5" y="76" width="305" height="360" preserveAspectRatio="xMidYMid meet"/>
    </mask>
  </defs>
  <rect width="512" height="512" rx="112" fill="#0A84FF"/>
  <rect x="103.5" y="76" width="305" height="360" fill="#fff" mask="url(#native-mark)"/>
</svg>
