[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "claude-profiles"
version = "0.0.1"
description = "Isolated Claude Desktop profiles, and Claude Code session history moved between them"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Caleb Barzee" }]
requires-python = ">=3.10"
dependencies = []
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS :: MacOS X",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
]

[project.urls]
Homepage = "https://github.com/calebbarzee/claude-profiles"

[project.scripts]
claude-profiles = "claude_profiles.cli:main"

[project.optional-dependencies]
dev = ["mypy>=1.11", "pytest>=8.0", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["claude_profiles"]

[tool.hatch.build.targets.sdist]
# the raycast extension ships through the raycast store, not pypi
only-include = ["claude_profiles", "tests", "docs", "docker", "README.md", "LICENSE"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "PTH", "C4", "ARG", "RET"]
ignore = ["RET504"]

[tool.ruff.lint.per-file-ignores]
# pytest fixtures are requested by name, not used by name.
"tests/*" = ["ARG001"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
