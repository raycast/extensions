    mocks:
      convert-currency:
        amount: 500
        from: UAH
        to: USD
        result: 10.88
        steps:
          - from: UAH
            to: USD
            amount: 500
            result: 10.88
            rateType: sell
            quote: "1 USD = 45.9495 UAH"
            ratesDate: "2026-11-09T09:05"
        stale: false
        updatedAt: "2026-11-09T09:10:00.000Z"
    expected:
      - callsTool:
          name: convert-currency
          arguments:
            amount: 500
            from: UAH
            to: USD
