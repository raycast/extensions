# aria2.conf - template for the aria2 runtime configuration.
#
# Aria2Common.ps1 replaces double-brace placeholders and writes the generated
# file to aria2.runtime.conf in the engine state directory.
#
# Lines starting with the conditional marker are only kept when every
# placeholder on that line has a non-empty value.
#
# Do not edit the generated runtime file; change settings through
# Set-Aria2Settings.ps1 (or Initialize-Aria2.ps1) instead.

# Download engine
dir={{DIR}}
split={{SPLIT}}
max-connection-per-server={{MAX_CONN_PER_SERVER}}
min-split-size={{MIN_SPLIT_SIZE}}
max-concurrent-downloads={{MAX_CONCURRENT_DOWNLOADS}}
file-allocation={{FILE_ALLOCATION}}
disk-cache={{DISK_CACHE}}
max-overall-download-limit={{MAX_OVERALL_DOWNLOAD_LIMIT}}
max-overall-upload-limit={{MAX_OVERALL_UPLOAD_LIMIT}}

# HTTP / FTP
connect-timeout={{CONNECT_TIMEOUT}}
timeout={{TIMEOUT}}
max-tries={{MAX_TRIES}}
retry-wait={{RETRY_WAIT}}
lowest-speed-limit={{LOWEST_SPEED_LIMIT}}
remote-time=true
content-disposition-default-utf8=true
check-certificate={{CHECK_CERTIFICATE}}

# Session persistence
save-session={{SAVE_SESSION}}
save-session-interval={{SAVE_SESSION_INTERVAL}}
force-save=false

# Logging (process runs hidden; the log file is the diagnostics trail)
log={{LOG}}
log-level=warn
console-log-level=warn
summary-interval=0

# JSON-RPC (loopback only; token is read from rpc-secret.txt)
enable-rpc=true
rpc-listen-all=false
rpc-allow-origin-all=true
rpc-listen-port={{RPC_PORT}}
rpc-secret={{RPC_SECRET}}

# BitTorrent
listen-port={{LISTEN_PORT}}
dht-listen-port={{DHT_LISTEN_PORT}}
enable-dht={{ENABLE_DHT}}
enable-peer-exchange={{ENABLE_PEER_EXCHANGE}}
bt-enable-lpd={{BT_ENABLE_LPD}}
bt-max-peers={{BT_MAX_PEERS}}
bt-require-crypto={{BT_REQUIRE_CRYPTO}}
seed-time={{SEED_TIME}}
seed-ratio={{SEED_RATIO}}
bt-save-metadata={{BT_SAVE_METADATA}}
bt-load-saved-metadata={{BT_LOAD_SAVED_METADATA}}
rpc-save-upload-metadata={{RPC_SAVE_UPLOAD_METADATA}}
#?bt-tracker={{BT_TRACKER}}

# Proxy (custom mode only; direct mode is passed on the aria2 command line)
#?all-proxy={{ALL_PROXY}}
#?no-proxy={{NO_PROXY}}

# Completion notifications are handled by Watch-Aria2.ps1.
# aria2 1.37 Windows hooks are unreliable (CreateProcess failures), so the
# engine intentionally leaves the on-download-* options unset.
