        <path d="M 66 186 C 101 156, 101 216, 136 186 S 171 156, 206 186" />
        <path d="M 66 256 C 101 226, 101 286, 136 256 S 171 226, 206 256" />
        <path d="M 66 326 C 101 296, 101 356, 136 326 S 171 296, 206 326" />
    </g>

    <!-- Right Side: Order (Straight Lines) -->
    <g opacity="1.0">
        <line x1="306" y1="186" x2="446" y2="186" />
        <line x1="306" y1="256" x2="446" y2="256" />
        <line x1="306" y1="326" x2="446" y2="326" />
    </g>
    
  </g>
</svg>
