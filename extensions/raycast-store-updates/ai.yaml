instructions: |
  An @raycast-store-updates mention selects this extension. Do not treat the mention as the subject or search query unless the user explicitly asks about the Raycast Store Updates extension.
  For a broad question such as "what's new this week?", include both new and updated extensions by calling find-store-updates with type: all.
  For "this week" or "past week", use days: 7 rather than calculating a calendar date.
  If the user asks only for updates, call find-store-updates with type: updated.
  If totalMatches exceeds the number of items returned, always state the exact number of additional matches. For example, totalMatches: 46 with two items means 44 more matches.
  If updatesUnavailable is present, say that GitHub updates could not be loaded; any new extensions in items still came from the Store feed.
  If updatesWindowIncomplete is true, say that update coverage is only guaranteed after updatesCoverageSince and that older updates may be missing.
  For an updated item, updatedBy is the PR submitter, not necessarily the extension author. Use changeSummary for what changed when available.

evals:
  - input: "@raycast-store-updates Show me the 2 newest extensions."
    mocks:
      find-store-updates:
        totalMatches: 4
        items:
          - title: Quick Notes
            description: Capture notes from anywhere
            type: new
            date: "2026-09-21T12:00:00Z"
            author: example
            url: https://www.raycast.com/example/quick-notes
          - title: Focus Timer
            description: Start a focus session
            type: new
            date: "2026-09-20T12:00:00Z"
            author: example
            url: https://www.raycast.com/example/focus-timer
    expected:
      - callsTool:
          name: find-store-updates
          arguments:
            type: new
            limit: 2
      - includes: Focus Timer
      - includes: Quick Notes
      - matches: "(2|two).*(more|additional|other)"

  - input: "@raycast-store-updates What updates are available for my installed extensions?"
    mocks:
      find-store-updates:
        totalMatches: 1
        items:
          - title: Calendar
            description: Improved event search
            type: updated
            date: "2026-09-21T12:00:00Z"
            updatedBy: example
            url: https://www.raycast.com/example/calendar
    expected:
      - callsTool:
          name: find-store-updates
          arguments:
            installedOnly: true
      - includes: Calendar

  - input: "@raycast-store-updates Find recent timer extensions."
    mocks:
      find-store-updates:
        totalMatches: 1
        items:
          - title: Focus Timer
            description: Start a focus session
            type: new
            date: "2026-09-25T12:00:00Z"
            author: example
            url: https://www.raycast.com/example/focus-timer
    expected:
      - callsTool:
          name: find-store-updates
          arguments:
            query:
              includes: timer
      - includes: Focus Timer

  - input: "@raycast-store-updates What new extensions were published in the last 3 days?"
    mocks:
      find-store-updates:
        totalMatches: 1
        items:
          - title: Focus Timer
            description: Start a focus session
            type: new
            date: "2026-09-25T12:00:00Z"
            author: example
            url: https://www.raycast.com/example/focus-timer
    expected:
      - callsTool:
          name: find-store-updates
          arguments:
            type: new
            days: 3
      - includes: Focus Timer

  - input: "@raycast-store-updates What new extensions were published since September 1, 2026?"
    usedAsExample: false
    mocks:
      find-store-updates:
        totalMatches: 1
        items:
          - title: Focus Timer
            description: Start a focus session
            type: new
            date: "2026-09-20T12:00:00Z"
            author: example
            url: https://www.raycast.com/example/focus-timer
    expected:
      - callsTool:
          name: find-store-updates
          arguments:
            type: new
            since: "2026-09-01"
      - includes: Focus Timer

  - input: "@raycast-store-updates What new extensions were published since September 26, 2026?"
    usedAsExample: false
    mocks:
      find-store-updates:
        totalMatches: 0
        items: []
    expected:
      - callsTool:
          name: find-store-updates
          arguments:
            type: new
            since: "2026-09-26"
      - matches: "(no|none|haven't been any|not been any).*new"
      - not:
          matches: "https?://"

  - input: "@raycast-store-updates what's new this week?"
    usedAsExample: false
    mocks:
      find-store-updates:
        totalMatches: 49
        updatesCoverageSince: "2026-09-25T12:49:01Z"
        updatesWindowIncomplete: true
        items:
          - { title: Gaffiot Latin-French Dictionary, description: Latin-French dictionary, type: new, date: "2026-09-26T21:28:28Z", author: David Tavan, url: https://www.raycast.com/davidyannick/gaffiot }
          - { title: Orion, description: Manage Orion bookmarks, type: updated, date: "2026-09-26T19:51:21Z", updatedBy: szpony, changeSummary: "Orion: focus and follow the current tab in the Command Bar", url: https://www.raycast.com/plonq/orion }
          - { title: Slides2PDF, description: Convert slides to PDF, type: new, date: "2026-09-22T07:46:33Z", author: Bertro, url: https://www.raycast.com/bertro/slides2pdf }
    expected:
      - callsTool:
          name: find-store-updates
          arguments:
            days: 7
      - includes: Orion
      - matches: "([Ss]ep(tember)?\\.? ?25|9/25|2026-09-25)"
      - matches: "(missing|incomplete|partial|may not|might not|older|[Oo]nly)"
      - matches: "(46|forty-six)"

  - input: "@raycast-store-updates what was updated this week?"
    usedAsExample: false
    mocks:
      find-store-updates:
        totalMatches: 49
        updatesCoverageSince: "2026-09-25T12:49:01Z"
        updatesWindowIncomplete: true
        items:
          - { title: Orion, description: Manage Orion bookmarks, type: updated, date: "2026-09-26T19:51:21Z", updatedBy: szpony, changeSummary: "Orion: focus and follow the current tab in the Command Bar", url: https://www.raycast.com/plonq/orion }
          - { title: Dokploy, description: Deploy anywhere, type: updated, date: "2026-09-26T09:04:38Z", updatedBy: merttopuz, changeSummary: "[Dokploy] Add Docker Cleanup action", url: https://www.raycast.com/xmok/dokploy }
    expected:
      - callsTool:
          name: find-store-updates
          arguments:
            type: updated
      - matches: "([Ss]ep(tember)?\\.? ?25|9/25|2026-09-25)"
      - matches: "(missing|incomplete|partial|may not|might not|older|[Oo]nly)"

  - input: "@raycast-store-updates What new and updated extensions appeared this week?"
    mocks:
      find-store-updates:
        totalMatches: 1
        updatesUnavailable: GitHub rate limit reached.
        items:
          - { title: Swift Salamander, description: Open paths in Swift Salamander, type: new, date: "2026-09-25T21:06:15Z", author: c0desurfer, url: https://www.raycast.com/c0desurfer/swift-salamander }
    expected:
      - callsTool:
          name: find-store-updates
          arguments:
            type: all
            days: 7
      - includes: Swift Salamander
      - matches: "(unavailable|could not|unable|rate limit)"

  - input: "@raycast-store-updates What changed in the Slack extension this week?"
    mocks:
      find-store-updates:
        totalMatches: 1
        items:
          - { title: Slack, description: Work with Slack, type: updated, date: "2026-09-25T12:00:00Z", updatedBy: contributor, changeSummary: Fix message search, url: https://www.raycast.com/slack/slack }
    expected:
      - callsTool:
          name: find-store-updates
          arguments:
            query:
              includes: slack
            type: updated
            days: 7
      - includes: Slack
      - includes: message search
