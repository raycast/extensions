[package]
name = "moodist-windows"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "moodist-windows"
path = "src/main.rs"

[dependencies]
raycast-rust-macros = { git = "https://github.com/raycast/extensions-rust-tools", rev = "c7a3cb2412d1d0b010bdaf66c3ae4a7ad9eb1eac" }
raycast-rust-runtime = { git = "https://github.com/raycast/extensions-rust-tools", rev = "c7a3cb2412d1d0b010bdaf66c3ae4a7ad9eb1eac" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
  "Foundation", "Media_Core", "Media_Playback", "Storage",
  "Win32_Foundation", "Win32_Security", "Win32_System_Com",
  "Win32_System_Threading", "Win32_Storage_FileSystem", "Win32_System_Console"
] }
