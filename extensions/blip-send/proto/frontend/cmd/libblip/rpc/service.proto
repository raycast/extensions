syntax = "proto3";
package rpc;

import "google/protobuf/empty.proto";

service Service {
  rpc GetState(rpc.StateRequest) returns (rpc.BinaryStateResponse);
  rpc Dispatch(rpc.DispatchRequest) returns (google.protobuf.Empty);
}

message StateRequest {
  optional uint64 last_rcvd = 1;
}

message BinaryStateResponse {
  uint64 id = 1;
  bytes state = 2;
}

message DispatchRequest {
  bytes event = 1;
}
