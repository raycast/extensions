[package]
name = "timers-windows"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "timers-windows"
path = "src/main.rs"

[dependencies]
raycast-rust-macros = { git = "https://github.com/raycast/extensions-rust-tools", rev = "c7a3cb2", package = "raycast-rust-macros" }
raycast-rust-runtime = { git = "https://github.com/raycast/extensions-rust-tools", rev = "c7a3cb2", package = "raycast-rust-runtime" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
  "Foundation", "Foundation_Collections", "Data_Xml_Dom", "UI_Notifications", "Storage", "Storage_Streams",
  "Media_Core", "Media_Playback", "Media_SpeechSynthesis", "Media_Control", "Win32_System_WinRT",
  "Win32_Foundation", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading", "Win32_Storage_Packaging_Appx", "Win32_Security"
] }
