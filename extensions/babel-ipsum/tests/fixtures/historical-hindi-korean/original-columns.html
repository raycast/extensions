<center><b>현대어</b> </center>
<div class="poem">
<p><br />
</p>
<center><big>먼 후일</big></center><br />
<p><br />
먼 훗날 당신이 찾으시면<br />
그때에 내 말이 `잊었노라'<br />
<br />
당신이 속으로 나무라면<br />
`무척 그리다가 잊었노라'<br />
<br />
그래도 당신이 나무라면<br />
`믿기지 않아서 잊었노라'<br />
<br />
오늘도 어제도 아니 잊고<br />
먼 훗날 그때에 `잊었노라'
</p>

<p><br />
</p>
<center><big>먼後日</big></center><br />
<p><br />
먼훗날 당신이 차즈시면 <br />
그ᄯᅢ에 내말이 「니젓노라」 <br />
<br />
당신이 속으로나무리면 <br />
「뭇쳑그리다가 니젓노라」 <br />
<br />
그래도 당신이 나무리면 <br />
「밋기지안어서 니젓노라」 <br />
<br />
오늘도어제도 아니닛고 <br />
먼훗날 그ᄯᅢ에 「니젓노라」
</p>
