<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4A90E2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#357ABD;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="64" cy="64" r="60" fill="url(#grad)" stroke="#2C5282" stroke-width="2"/>

  <!-- Terminal window -->
  <rect x="20" y="25" width="88" height="70" rx="4" fill="#1E1E1E" stroke="#4A90E2" stroke-width="2"/>

  <!-- Title bar -->
  <rect x="20" y="25" width="88" height="12" fill="#2D2D2D"/>

  <!-- Window controls -->
  <circle cx="28" cy="31" r="3" fill="#FF5F57"/>
  <circle cx="38" cy="31" r="3" fill="#FEBC2E"/>
  <circle cx="48" cy="31" r="3" fill="#28C840"/>

  <!-- Terminal content -->
  <rect x="28" y="42" width="72" height="45" fill="#000000"/>

  <!-- Prompt -->
  <text x="32" y="52" font-family="monospace" font-size="8" fill="#4A90E2">$</text>

  <!-- Cursor -->
  <rect x="38" y="48" width="6" height="10" fill="#4A90E2">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>

  <!-- Text lines -->
  <text x="32" y="58" font-family="monospace" font-size="6" fill="#A0A0A0">cd ~/projects</text>
  <text x="32" y="68" font-family="monospace" font-size="6" fill="#4A90E2">$</text>
  <text x="38" y="68" font-family="monospace" font-size="6" fill="#A0A0A0">ls</text>

  <!-- Tabs indicator -->
  <rect x="20" y="95" width="88" height="8" fill="#2D2D2D" rx="2"/>
  <rect x="22" y="97" width="20" height="4" fill="#4A90E2" rx="1"/>
  <rect x="45" y="97" width="15" height="4" fill="#3A3A3A" rx="1"/>
  <rect x="63" y="97" width="18" height="4" fill="#3A3A3A" rx="1"/>
  <rect x="84" y="97" width="12" height="4" fill="#3A3A3A" rx="1"/>
</svg>
