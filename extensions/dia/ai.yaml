instructions: |
  # dia-ai-actions
  Dia is a web browser by The Browser Company. Use open-url to open a page or run a web search in a new tab; pass the user's words as the url when they ask to search for something.
  To switch to a tab, pass a short query that matches its title or URL (e.g. "github"), or no target at all when the user means the current tab. If the tool reports several matching tabs, ask the user which one they mean and retry with its tabId.
  close-tab only closes a tab given its tabId. If the get-tabs tool is available, take the tabId from it. Otherwise call close-tab with a query (or no target for the current tab): it closes nothing and returns a candidate, then call close-tab again with that candidate's tabId. Never tell the user a tab was closed unless close-tab returned closed: true.
  If a tool reports that Raycast needs permission to control Dia, relay its System Settings instructions instead of retrying or claiming the action succeeded.
  # dia-ai-tab-contents
  Use get-tab-contents to read a page before summarizing it or answering questions about it. Always call it for questions about a page's contents, even after get-focused-tab or get-tabs; never answer from a tab's title or URL alone. Call it without a target for "this page" or "the current tab", or pass a short query matching the tab's title or URL.
  If it reports that Dia must allow JavaScript from AppleScript, tell the user how to relaunch Dia instead of guessing the page contents. If it reports that Raycast needs permission to control Dia, relay its System Settings instructions instead of retrying. If it reports that the page has no readable text, tell the user the page has no readable text and don't describe or guess its contents. If it reports a Dia internal page, tell the user it's a Dia internal page that can't be read, without guessing its contents. If it reports that it couldn't read this tab for another reason, you may retry once; if it fails again, tell the user you couldn't read this tab and share the error, without guessing its contents. If the text is truncated, say that the answer is based on the beginning of the page.
  # dia-ai-read
  Use get-focused-tab when the user refers to "this tab", "the current tab" or "the page I'm on", and get-tabs for questions about open tabs.
  Use search-history for pages the user visited before and search-bookmarks for saved bookmarks. Only pass searchText when the user names something to look for, and keep it to the essential keywords.
  Never show tab or window IDs to the user unless they ask for them.
  If get-tabs or get-focused-tab reports that Raycast needs permission to control Dia, relay its System Settings instructions instead of retrying or saying there are no tabs.

evals:
  # dia-ai-actions
  - input: "@dia open raycast.com"
    mocks:
      open-url:
        openedURL: "https://raycast.com"
    expected:
      - callsTool:
          name: open-url
          arguments:
            url:
              includes: "raycast.com"
  - input: "@dia search the web for best espresso machines"
    mocks:
      open-url:
        openedURL: "https://www.google.com/search?q=best%20espresso%20machines"
    expected:
      - callsTool:
          name: open-url
          arguments:
            url:
              includes: "espresso"
  - input: "@dia switch to my Hacker News tab"
    mocks:
      select-tab:
        title: "Hacker News"
        url: "https://news.ycombinator.com/"
      get-tabs:
        - windowId: "W1"
          tabId: "T3"
          title: "Hacker News"
          url: "https://news.ycombinator.com/"
          isPinned: false
          isFocused: false
    expected:
      - or:
          - callsTool:
              name: select-tab
              arguments:
                query:
                  includes: "hacker news"
          - callsTool:
              name: select-tab
              arguments:
                tabId: "T3"
  - input: "@dia close the current tab"
    mocks:
      close-tab: "Nothing was closed. Candidate: tabId T2, title Hacker News, url https://news.ycombinator.com/. Call close-tab again with tabId T2 to close it."
      get-focused-tab:
        windowId: "W1"
        tabId: "T2"
        title: "Hacker News"
        url: "https://news.ycombinator.com/"
        isPinned: false
        isFocused: true
      get-tabs:
        - windowId: "W1"
          tabId: "T2"
          title: "Hacker News"
          url: "https://news.ycombinator.com/"
          isPinned: false
          isFocused: true
    expected:
      - callsTool:
          name: close-tab
          arguments:
            tabId: "T2"
  - input: "@dia close the YouTube tab"
    mocks:
      close-tab: "Nothing was closed. Candidate: tabId T7, title Lo-fi beats - YouTube, url https://www.youtube.com/watch?v=abc. Call close-tab again with tabId T7 to close it."
      get-tabs:
        - windowId: "W1"
          tabId: "T7"
          title: "Lo-fi beats - YouTube"
          url: "https://www.youtube.com/watch?v=abc"
          isPinned: false
          isFocused: false
    expected:
      - or:
          - callsTool:
              name: close-tab
              arguments:
                query:
                  includes: "youtube"
          - callsTool: get-tabs
      - callsTool:
          name: close-tab
          arguments:
            tabId: "T7"
  - input: "@dia close the tab with ID T9"
    mocks:
      close-tab:
        closed: true
        closedTab:
          tabId: "T9"
          title: "Raycast"
          url: "https://www.raycast.com/"
    expected:
      - callsTool:
          name: close-tab
          arguments:
            tabId: "T9"
  - input: "@dia close the tab with ID T5"
    mocks:
      close-tab: "Error: No open tabs found in Dia. Make sure Dia is open. Raycast needs permission to control Dia. Enable Dia under Raycast in System Settings → Privacy & Security → Automation, then try again. Nothing was closed."
    expected:
      - callsTool:
          name: close-tab
          arguments:
            tabId: "T5"
      - includes: "Automation"
  - input: "@dia switch to my GitHub tab"
    mocks:
      select-tab: "Error: No open tabs found in Dia. Make sure Dia is open. Raycast needs permission to control Dia. Enable Dia under Raycast in System Settings → Privacy & Security → Automation, then try again."
      get-tabs: "Error: No open tabs found in Dia. Make sure Dia is open. Raycast needs permission to control Dia. Enable Dia under Raycast in System Settings → Privacy & Security → Automation, then try again."
    expected:
      - or:
          - callsTool:
              name: select-tab
              arguments:
                query:
                  includes: "github"
          - callsTool: get-tabs
      - includes: "Automation"
  # dia-ai-tab-contents
  - input: "@dia summarize this page in 3 bullet points"
    mocks:
      get-tab-contents:
        title: "Meet the new Raycast Notes"
        url: "https://www.raycast.com/blog/raycast-notes"
        loading: false
        truncated: false
        text: "Raycast Notes is a fast, light and frictionless note-taking experience. Notes open from anywhere with a hotkey, support Markdown, and sync across devices."
      get-focused-tab:
        windowId: "W1"
        tabId: "T1"
        title: "Meet the new Raycast Notes"
        url: "https://www.raycast.com/blog/raycast-notes"
        isPinned: false
        isFocused: true
    expected:
      - callsTool: get-tab-contents
      - includes: "Markdown"
  - input: "@dia what does the GitHub tab say about installation?"
    mocks:
      get-tab-contents:
        title: "raycast/extensions"
        url: "https://github.com/raycast/extensions"
        loading: false
        truncated: false
        text: "Installation: run npm install, then npm run dev inside the extension folder."
      get-tabs:
        - windowId: "W1"
          tabId: "T3"
          title: "raycast/extensions"
          url: "https://github.com/raycast/extensions"
          isPinned: false
          isFocused: false
    expected:
      - or:
          - callsTool:
              name: get-tab-contents
              arguments:
                query:
                  includes: "github"
          - callsTool:
              name: get-tab-contents
              arguments:
                tabId: "T3"
      - includes: "npm"
  - input: "@dia read the current page"
    mocks:
      get-tab-contents: "Error: Reading page contents requires Dia to allow JavaScript from AppleScript. Quit Dia, then reopen it from Terminal with: open -a Dia --args --enable-applescript-javascript"
      get-focused-tab:
        windowId: "W1"
        tabId: "T1"
        title: "Meet the new Raycast Notes"
        url: "https://www.raycast.com/blog/raycast-notes"
        isPinned: false
        isFocused: true
    expected:
      - callsTool: get-tab-contents
      - includes: "enable-applescript-javascript"
  - input: "@dia summarize the Hacker News tab"
    mocks:
      get-tab-contents: "Error: No open tabs found in Dia. Make sure Dia is open. Raycast needs permission to control Dia. Enable Dia under Raycast in System Settings → Privacy & Security → Automation, then try again."
      get-tabs: "Error: No open tabs found in Dia. Make sure Dia is open. Raycast needs permission to control Dia. Enable Dia under Raycast in System Settings → Privacy & Security → Automation, then try again."
    expected:
      - or:
          - callsTool:
              name: get-tab-contents
              arguments:
                query:
                  includes: "hacker news"
          - callsTool: get-tabs
      - includes: "Automation"
  - input: "@dia summarize the current page"
    mocks:
      get-tab-contents: 'Error: "sunset.jpg (1920×1080)" has loaded, but the page has no readable text (it may contain only images or media). Its contents can''t be summarized.'
      get-focused-tab:
        windowId: "W1"
        tabId: "T8"
        title: "sunset.jpg (1920×1080)"
        url: "https://example.com/sunset.jpg"
        isPinned: false
        isFocused: true
    expected:
      - callsTool: get-tab-contents
      - includes: "readable text"
  - input: "@dia what's on this page?"
    mocks:
      get-tab-contents: 'Error: "New Tab" is a Dia internal page, such as a new tab or settings. Dia internal pages cannot be read.'
      get-focused-tab:
        windowId: "W1"
        tabId: "T9"
        title: "New Tab"
        isPinned: false
        isFocused: true
    expected:
      - or:
          - callsTool: get-tab-contents
          - callsTool: get-focused-tab
      - or:
          - includes: "internal"
          - includes: "new tab"
  - input: "@dia summarize the Docs tab"
    mocks:
      get-tab-contents: 'Error: Couldn''t read this tab ("Docs"): execution error: Dia got an error: AppleEvent timed out. (-1712)'
      get-tabs:
        - windowId: "W1"
          tabId: "T4"
          title: "Docs"
          url: "https://docs.example.com/"
          isPinned: false
          isFocused: false
    expected:
      - or:
          - callsTool:
              name: get-tab-contents
              arguments:
                query:
                  includes: "docs"
          - callsTool:
              name: get-tab-contents
              arguments:
                tabId: "T4"
      - or:
          - includes: "couldn't read"
          - includes: "wasn't able to read"
          - includes: "unable to read"
          - includes: "could not read"
  # dia-ai-read
  - input: "@dia what tabs do I have open?"
    mocks:
      get-tabs:
        - windowId: "W1"
          tabId: "T1"
          title: "Raycast - Your shortcut to everything"
          url: "https://www.raycast.com/"
          isPinned: true
          isFocused: false
        - windowId: "W1"
          tabId: "T2"
          title: "Hacker News"
          url: "https://news.ycombinator.com/"
          isPinned: false
          isFocused: true
    expected:
      - callsTool: get-tabs
      - includes: "Hacker News"
  - input: "@dia which page am I looking at right now?"
    mocks:
      get-focused-tab:
        windowId: "W1"
        tabId: "T2"
        title: "Hacker News"
        url: "https://news.ycombinator.com/"
        isPinned: false
        isFocused: true
    expected:
      - callsTool: get-focused-tab
      - includes: "Hacker News"
  - input: "@dia do I have a GitHub tab open?"
    mocks:
      get-tabs:
        - windowId: "W1"
          tabId: "T3"
          title: "raycast/extensions: Everything you need to extend Raycast."
          url: "https://github.com/raycast/extensions"
          isPinned: false
          isFocused: false
    expected:
      - callsTool: get-tabs
      - includes: "raycast/extensions"
  - input: "@dia find raycast in my history"
    mocks:
      search-history:
        - id: 74
          url: "https://www.raycast.com/blog/raycast-notes"
          title: "Meet the new Raycast Notes - Raycast Blog"
          lastVisitedAt: "2026-10-01 20:22:18"
    expected:
      - callsTool:
          name: search-history
          arguments:
            searchText:
              includes: "raycast"
  - input: "@dia show me the last 10 pages I visited"
    mocks:
      search-history:
        - id: 80
          url: "https://www.raycast.com/"
          title: "Raycast"
          lastVisitedAt: "2026-10-08 09:12:00"
    expected:
      - callsTool:
          name: search-history
          arguments:
            limit: 10
  - input: "@dia search my bookmarks for react"
    mocks:
      search-bookmarks:
        - name: "React"
          url: "https://react.dev/"
          folder: "Bookmarks Bar › Dev"
    expected:
      - callsTool:
          name: search-bookmarks
          arguments:
            searchText:
              includes: "react"
      - includes: "react.dev"
  - input: "@dia list my open tabs"
    mocks:
      get-tabs: "Error: No open tabs found in Dia. Make sure Dia is open. Raycast needs permission to control Dia. Enable Dia under Raycast in System Settings → Privacy & Security → Automation, then try again."
    expected:
      - callsTool: get-tabs
      - includes: "Automation"
