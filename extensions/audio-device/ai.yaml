instructions: |
  Use list-audio-devices before switching to a named device. Pass its exact ID to set-audio-device.
  Input devices are microphones. Output devices are speakers and headphones.
evals:
  - input: "@audio-device Which output devices are available?"
    mocks:
      list-audio-devices:
        - id: "speaker-1"
          name: "MacBook Pro Speakers"
          isDefault: true
        - id: "headphones-2"
          name: "Headphones"
          isDefault: false
    expected:
      - callsTool:
          name: list-audio-devices
          arguments:
            type: output
      - includes: "Headphones"
  - input: "@audio-device Switch my output to Headphones"
    mocks:
      list-audio-devices:
        - id: "speaker-1"
          name: "MacBook Pro Speakers"
          isDefault: true
        - id: "headphones-2"
          name: "Headphones"
          isDefault: false
      set-audio-device: "Active output device set to Headphones."
    expected:
      - callsTool:
          name: set-audio-device
          arguments:
            type: output
            deviceId: headphones-2
  - input: "@audio-device Set my microphone volume to 40%"
    mocks:
      list-audio-devices:
        - id: "microphone-1"
          name: "Built-in Microphone"
          isDefault: true
      set-audio-volume: "Built-in Microphone input volume set to 40%."
    expected:
      - callsTool:
          name: set-audio-volume
          arguments:
            type: input
            volume: 40
