name: caviarde

services:
  detector:
    # Pinned by digest because the image is unsigned and later upstream builds
    # are unreviewed. See docs/security-notes.md before changing this.
    image: ghcr.io/sgasser/pasteguard@sha256:0122664876c0635efddbc61b838ca9bf1b821878396d46d8126bb95afe8d6a3c

    # The image default starts supervisord, which also boots the proxy and binds
    # the detector to a container-local address the host cannot reach.
    command: ["uvicorn", "detector.app:app", "--host", "0.0.0.0", "--port", "5002"]

    ports:
      # Loopback only: /analyze is unauthenticated.
      - "127.0.0.1:${CAVIARDE_DETECTOR_PORT:-5002}:5002"

    volumes:
      # Upstream hardcodes the GLiNER label list, so organisations need this
      # three-line patch. See docs/detector-patch.md.
      - ./assets/detector-patch/gliner_layer.py:/opt/venv/lib/python3.14/site-packages/detector/gliner_layer.py:ro

    environment:
      # Upstream floors are tuned for precision and drop most French names.
      GLINER_FLOOR_PERSON: "0.95"
      GLINER_FLOOR_LOCATION: "0.70"
      GLINER_FLOOR_ADDRESS: "0.70"
      GLINER_FLOOR_ORGANIZATION: "0.50"

    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

    restart: unless-stopped

    healthcheck:
      # The inherited healthcheck probes a proxy on :3000 that this file never starts.
      test:
        - CMD
        - python
        - -c
        - import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:5002/health').status==200 else 1)
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
