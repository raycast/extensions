instructions: |
  Slack user IDs and conversation IDs are not interchangeable. User IDs start with U or W; conversation IDs start with C, D, or G.
  When uploading files to a person named by the user, first call find-users, then call read-conversation with the returned U or W user ID to resolve the DM, and finally call upload-files with the D-prefixed channel ID returned by read-conversation. Never pass a U or W user ID to upload-files.

evals:
  - input: "@slack set my status to away"
    expected:
      - callsTool:
          name: set-status
          arguments:
            text:
              includes: away
    mocks:
      set-status: success
  - input: "@slack summarize messages in #general after 2025-05-19T15:00:00Z"
    expected:
      - callsTool:
          name: get-channels
      - callsTool:
          name: get-channel-history
          arguments:
            text: C87654321
            after: "2025-05-19T15:00:00Z"
    mocks:
      get-channels:
        - id: C87654321
          name: general
          purpose: Company-wide announcements and discussion
      get-channel-history:
        - text: Shared the launch plan and assigned the remaining tasks.
          user: U87654321
          ts: "1747669500.000200"
          date: "2025-05-19T15:45:00.000Z"
  - input: "@slack find the channel ID for #product-team-issue-notification and summarize messages after 2025-05-19T15:00:00Z"
    expected:
      - callsTool:
          name: get-channels
      - callsTool:
          name: get-channel-history
          arguments:
            text: C12345678
            after: "2025-05-19T15:00:00Z"
    mocks:
      get-channels:
        - id: C12345678
          name: product-team-issue-notification
          purpose: Product issue notifications
      get-channel-history:
        - text: Fixed a checkout regression and deployed the patch.
          user: U12345678
          ts: "1747668600.000100"
          date: "2025-05-19T15:30:00.000Z"
  - input: '@slack reply "I will take a look" to this thread: https://example.slack.com/archives/C12345678/p1718899200000100'
    expected:
      - callsTool:
          name: reply-thread
          arguments:
            channel: C12345678
            threadTs: "1718899200.000100"
            text:
              includes: I will take a look
    mocks:
      reply-thread: success
  - input: "@slack reply \"We doubled since this morning \U0001F92F\" to this thread
      and also send it to the channel: https://example.slack.com/archives/C12345678/p1718899200000100"
    expected:
      - callsTool:
          name: reply-thread
          arguments:
            channel: C12345678
            threadTs: "1718899200.000100"
            text:
              includes: We doubled since this morning
            replyBroadcast: true
    mocks:
      reply-thread: success
  - input: "@slack react with :thumbsup: to https://example.slack.com/archives/C12345678/p1718899200000100"
    expected:
      - callsTool:
          name: add-reaction
          arguments:
            channel: C12345678
            messageTs: "1718899200.000100"
            emoji:
              includes: thumbsup
    mocks:
      add-reaction: success
  - input: '@slack edit this message to say "Updated copy": https://example.slack.com/archives/C12345678/p1718899200000100'
    expected:
      - callsTool:
          name: update-message
          arguments:
            channel: C12345678
            messageTs: "1718899200.000100"
            text:
              includes: Updated copy
    mocks:
      update-message: success
  - input: '@slack send this screenshot to Daniel with the message "Testing Slack attachments":
      /Users/me/Desktop/test.png'
    expected:
      - callsTool:
          name: find-users
          arguments:
            query:
              includes: Daniel
      - callsTool:
          name: read-conversation
          arguments:
            conversation:
              includes: U12345678
      - callsTool:
          name: upload-files
          arguments:
            channel:
              includes: D12345678
            filePaths:
              includes: "/Users/me/Desktop/test.png"
            text:
              includes: Testing Slack attachments
    mocks:
      find-users:
        - id: U12345678
          displayName: Daniel
      read-conversation:
        channel: D12345678
      upload-files: success
  - input: "@slack get me a huddle link with Daniel"
    expected:
      - callsTool:
          name: find-users
          arguments:
            query:
              includes: Daniel
      - callsTool:
          name: get-huddle-link
          arguments:
            conversation:
              includes: U12345678
    mocks:
      find-users:
        - id: U12345678
          displayName: Daniel
      get-huddle-link:
        workspaceId: T12345678
        channel: D12345678
        url: https://app.slack.com/huddle/T12345678/D12345678
  - input: "@slack create a group DM with Alicia and Roy and send them this screenshot:
      /Users/me/Desktop/test.png"
    expected:
      - callsTool:
          name: find-users
          arguments:
            query:
              includes: Alicia
      - callsTool:
          name: find-users
          arguments:
            query:
              includes: Roy
      - callsTool:
          name: open-group-dm
          arguments:
            userIds:
              - includes: U12345678
              - includes: U87654321
      - callsTool:
          name: upload-files
          arguments:
            channel:
              includes: G12345678
            filePaths:
              includes: "/Users/me/Desktop/test.png"
    mocks:
      find-users:
        - id: U12345678
          displayName: Alicia
        - id: U87654321
          displayName: Roy
      open-group-dm:
        channel: G12345678
        userIds:
          - U12345678
          - U87654321
      upload-files: success
