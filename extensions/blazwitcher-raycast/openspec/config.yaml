schema: spec-driven

context: |
  项目为 Blazwitcher 的 Raycast 原生单栏搜索扩展，支持 macOS 上的 Google Chrome。
  使用 text-search-engine 搜索标签页、书签和历史记录，按原始记录准确跳转。
  保持默认单栏，不使用独立 Electron 浮窗；用户已允许主动展开原生详情，当前为试用功能。当前实施计划见 docs/实施计划.md。
  内置 Clipboard History 有私有 DOM 高亮，但公开 List API 未暴露同等能力；不能把行内高亮写成已完成。
  所有说明正文使用中文，保留 OpenSpec 必需英文结构标题与 SHALL/MUST。

rules:
  proposal:
    - 明确功能范围、接口限制及待验证项。
  design:
    - 区分内置功能和公开扩展 API，明确数据、匹配及导航语义。
  tasks:
    - 分开记录静态检查、逻辑测试、真实界面和真实跳转验证。
