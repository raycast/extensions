# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# https://docs.coderabbit.ai/getting-started/yaml-configuration
# On any PR, comment "@coderabbitai configuration" to see the resolved config.
#
# VocaBuilder is a public MIT Raycast extension. CodeRabbit's open-source plan
# covers public GitHub repos (Team features, no paid seat). Until the repo has
# 10 GitHub stars, CodeRabbit does not auto-review: comment
# "@coderabbitai review" or click Trigger review on the status comment.
# AGENTS.md / CLAUDE.md are picked up automatically as code guidelines.

language: en-US

reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  review_details: false
  collapse_walkthrough: false
  changed_files_summary: true
  sequence_diagrams: true
  auto_review:
    enabled: true
    drafts: false
    auto_incremental_review: true
    ignore_title_keywords:
      - WIP
      - "[skip review]"
    ignore_usernames:
      - dependabot[bot]
      - renovate[bot]
      - github-actions[bot]
  path_filters:
    - "!evals/results/**"
  path_instructions:
    - path: "src/**/*.{ts,tsx}"
      instructions: |
        This is a Raycast extension, not a language-learning app: fast glosses first.
        Do not assume English or Ukrainian on either side of a language pair.
        Use Unicode-aware matching (`\p{L}` / `\p{N}` with the `u` flag); never `\b` or `[a-zA-Z]` for words.
        Never place secrets in URLs or query strings. Never interpolate raw user input into LLM prompts — validate length/shape first and embed values with JSON.stringify.
        Map failures to stable user-safe messages; do not leak raw upstream errors, parser internals, or validation traces.
        Do not export functions, constants, or types solely for tests. In-source `import.meta.vitest` blocks ship in the Raycast bundle, so keep them free of secrets and unpublished details.
        Prefer tests that encode product contracts over schema-shape restatements.
    - path: "src/**/*.tsx"
      instructions: |
        Use `@raycast/api` for UI. Do not build a custom navigation stack; use `useNavigation`.
        Avoid Raycast-reserved Action shortcuts (Cmd+K/W/Esc/P, Cmd+Enter, Ctrl+P/N, Cmd+,).
        Word lookup is multi-sense with user selection before persistence; phrase/text translation is a single saved result.
        When both example sentences are shown, render `exampleTranslation` (source-language sentence containing the looked-up word) first and `example` (target-language rendering) second. The names read backwards — check `src/lib/types.ts`.
        Match History and Translate Recent list/detail behavior when touching those screens.
    - path: "src/lib/**"
      instructions: |
        Keep `src/lib` free of `@raycast/api` imports.
        Route provider-derived failures through `ProviderError` / `providerError()` and `defaultToastFor`; do not add parallel string switches.
        `isProviderError` requires `kind`, `surface`, and `domain` on the cause. Outcomes are never retried; `isTransient` must stay infrastructure-only.
        Sense dedup compares translation + part of speech only.
        History may keep several rows for one lemma when gloss or POS differs; re-saving the same sense reuses the row id.
        Flashcard progress is keyed by `Translation.id` via required `translationId`, not the lemma string.
    - path: "src/lib/export.ts"
      instructions: |
        Anki export is a compatibility surface. `renderAnkiBack` must keep Anki's two-column Basic note type and fold both sentences into Back with `example` (target language) first — the reverse of detail panes. Changing that markup or the column count is a deliberate breaking change.
    - path: "src/lib/types.ts"
      instructions: |
        In the word-response schema, `exampleTranslation` is the source-language sentence and `example` is the target-language rendering. Flag any swap of those field meanings.
    - path: "**/*.{test,spec}.{ts,tsx}"
      instructions: |
        Use Vitest. Prefer in-source tests (`if (import.meta.vitest)`) for private code; do not export symbols solely for testing.
        Cover changed behavior in the same change. Encode product contracts, not declaration mirrors.
        Do not assert literal strings in config files (`package.json`, YAML) as an oracle.
    - path: "evals/**"
      instructions: |
        This harness evaluates production `translateWord` output (parsed, schema-validated, de-duplicated) or a mapped domain error — not raw model JSON. The suite runs one entry per vendor; CI filters to the gemini entry.
        Keep schema validation outside the LLM judge. Import Promptfoo's exported types; validate YAML-sourced inputs with Zod via `parseOrThrow`.
        Suite-wide Promptfoo settings belong in `evals/promptfooconfig.yaml`, not `package.json`.
        Language drift is a production-prompt fix, not a `forbiddenTranslations` regex.
    - path: "package.json"
      instructions: |
        This is a Raycast Store manifest. Keep `license: MIT`, command `name`/`src/<name>.tsx` alignment, and US English titles.
        Do not add external analytics. API keys belong in password preferences, never in the manifest.
    - path: ".github/workflows/**"
      instructions: |
        CI must use the Node version from `.nvmrc` (Node 22 / npm 10). Do not regenerate `package-lock.json` under npm 11.
        CodeRabbit reviews run via the GitHub App, not a GitHub Actions workflow — do not add a CodeRabbit Action.
  pre_merge_checks:
    description:
      mode: warning
    docstrings:
      mode: off
  tools:
    # @raycast/eslint-config is outside CodeRabbit's sandboxed plugin allow-list,
    # so their ESLint pass would be skipped. CI (`npm run lint`) remains the gate.
    eslint:
      enabled: false
    gitleaks:
      enabled: true
    trufflehog:
      enabled: true

chat:
  auto_reply: true

knowledge_base:
  code_guidelines:
    enabled: true
