<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Raycast 进程监视器 · 交互变体投票</title>
<style>
*{box-sizing:border-box}
[hidden]{display:none!important}
:root{
  --bg:#101011; --panel:#1c1c1e; --panel2:#242426; --sel:#3a3a3c; --fg:#f2f2f7; --mut:#8e8e93;
  --line:#2e2e30; --accent:#FF6363; --danger:#ff453a; --kbd:#2c2c2e; --hl:#3a3a3c;
}
[data-theme=light]{
  --bg:#f4f4f5; --panel:#fff; --panel2:#f2f2f4; --sel:#e4e4e8; --fg:#1c1c1e; --mut:#6e6e73;
  --line:#e3e3e6; --kbd:#ececef; --hl:#e4e4e8; --accent:#e8514f; --danger:#d8382f;
}
html,body{margin:0;background:var(--bg);color:var(--fg);
  font:13px/1.45 -apple-system,"SF Pro Text","PingFang SC",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--accent)}
.page{max-width:940px;margin:0 auto;padding:26px 20px 120px}
.phead{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}
h1{font-size:17px;margin:0 0 6px;font-weight:600;letter-spacing:.01em}
.lede{margin:0;color:var(--mut);font-size:12.5px;max-width:640px}
.hint{margin:8px 0 0;color:var(--mut);font-size:11.5px}
.vlist{list-style:none;margin:14px 0 18px;padding:0;display:grid;gap:6px}
.vlist li{display:flex;gap:10px;align-items:baseline;padding:7px 10px;border:1px solid var(--line);
  border-radius:8px;background:var(--panel);cursor:pointer}
.vlist li[aria-current=true]{border-color:var(--accent)}
.vlist b{font-weight:600;min-width:132px}
.vlist span{color:var(--mut);font-size:12px}
.vlist em{font-style:normal;color:var(--accent);font-size:11px;border:1px solid var(--accent);border-radius:5px;padding:0 5px;margin-left:auto}
.pctrl{display:flex;gap:6px;flex:0 0 auto}
.pbtn{background:var(--panel);border:1px solid var(--line);color:var(--fg);font:inherit;font-size:12px;
  padding:5px 10px;border-radius:7px;cursor:pointer}
.pbtn:hover{border-color:var(--mut)}

/* ---------- launcher mock ---------- */
.stage{display:flex;justify-content:center}
.win{position:relative;width:750px;height:480px;background:var(--panel);border:1px solid var(--line);
  border-radius:12px;box-shadow:0 18px 60px rgba(0,0,0,.45);overflow:hidden;display:flex;flex-direction:column}
[data-theme=light] .win{box-shadow:0 14px 40px rgba(0,0,0,.16)}
.winbar{height:3px;flex:0 0 auto;background:transparent}
.prog{height:3px;width:0;background:var(--accent);opacity:0;transition:width .35s ease-out,opacity .2s}
.prog.run{width:100%;opacity:1;transition:width .35s ease-out,opacity .05s}
.searchrow{display:flex;align-items:center;gap:8px;height:48px;padding:0 10px;border-bottom:1px solid var(--line);flex:0 0 auto}
.mag{color:var(--mut);display:flex;flex:0 0 auto}
#q{flex:1;min-width:0;background:transparent;border:0;outline:0;color:var(--fg);font:inherit;font-size:14px}
#q::placeholder{color:var(--mut)}
.ddbtn{display:flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--line);color:var(--fg);
  font:inherit;font-size:12px;padding:4px 8px;border-radius:7px;cursor:pointer;white-space:nowrap}
.ddbtn .chev{color:var(--mut);font-size:10px}
.menu{position:absolute;right:10px;top:44px;min-width:170px;background:var(--panel2);border:1px solid var(--line);
  border-radius:9px;padding:4px;z-index:30;box-shadow:0 12px 30px rgba(0,0,0,.4)}
.mitem{display:flex;justify-content:space-between;gap:12px;padding:6px 8px;border-radius:6px;font-size:12.5px;cursor:pointer}
.mitem[aria-selected=true]{background:var(--sel)}
.mitem .tick{color:var(--accent)}
.body{flex:1;display:flex;min-height:0}
.listpane{flex:1;min-width:0;display:flex;flex-direction:column}
.list{position:relative;flex:1;overflow:auto;padding:5px 0;scrollbar-width:thin}
.hl{position:absolute;left:5px;right:5px;top:0;height:40px;background:var(--hl);border-radius:7px;
  transition:transform .15s ease-out,height .15s ease-out,opacity .12s;opacity:0;z-index:0}
.row{position:relative;z-index:1;display:flex;align-items:center;gap:10px;height:40px;padding:0 10px;cursor:pointer}
.row.flat{cursor:default}
.icon{width:20px;height:20px;flex:0 0 auto;border-radius:5px;display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:700;color:#fff}
.meta{min-width:0;flex:1}
.t{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.s{font-size:11px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.sip .t,.row.sip .s{color:var(--mut)}
.acc{display:flex;gap:10px;align-items:center;flex:0 0 auto;font-size:12px;font-variant-numeric:tabular-nums;color:var(--mut)}
.acc .cpu{color:var(--fg);min-width:52px;text-align:right}
.acc .mem{min-width:58px;text-align:right}
.expand{background:transparent;border:0;color:var(--mut);cursor:pointer;font:inherit;padding:2px 4px;border-radius:5px;flex:0 0 auto}
.expand:hover{background:var(--panel2);color:var(--fg)}
.sec{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:10px 12px 4px;font-size:11px}
.sec b{font-weight:600;color:var(--mut);letter-spacing:.04em}
.sec span{color:var(--mut);font-variant-numeric:tabular-nums}
.crumb{display:flex;align-items:center;gap:6px;height:32px;padding:0 10px;font-size:12px;color:var(--mut)}
.crumb b{color:var(--fg);font-weight:500}
.crumb button{background:transparent;border:0;color:var(--mut);font:inherit;cursor:pointer;padding:0}
.crumb button:hover{color:var(--fg)}
.empty{padding:26px 12px;text-align:center;color:var(--mut);font-size:12.5px}
.detail{width:330px;flex:0 0 auto;border-left:1px solid var(--line);background:var(--panel2);overflow:auto;padding:12px 14px}
.dtop{display:flex;gap:10px;align-items:center;margin-bottom:12px}
.dtop .t{font-size:14px;font-weight:600}
.dl{font-size:11px;color:var(--mut);letter-spacing:.04em;text-transform:uppercase;margin:12px 0 4px}
.drow{display:flex;justify-content:space-between;gap:12px;font-size:12px;padding:3px 0;border-bottom:1px solid var(--line)}
.drow span:first-child{color:var(--mut)}
.drow span:last-child{font-variant-numeric:tabular-nums;text-align:right;word-break:break-all}
.dh{font-size:12px;color:var(--mut);padding:3px 0;display:flex;justify-content:space-between;gap:10px}
.foot{height:30px;flex:0 0 auto;border-top:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 12px;color:var(--mut);font-size:11.5px}
.kbd{display:inline-block;background:var(--kbd);border:1px solid var(--line);border-radius:5px;padding:0 5px;margin-right:5px;
  font-size:11px;color:var(--fg);font-variant-numeric:tabular-nums}
.apanel{position:absolute;left:10px;bottom:38px;width:270px;background:var(--panel2);border:1px solid var(--line);
  border-radius:9px;padding:4px;z-index:30;box-shadow:0 14px 34px rgba(0,0,0,.45)}
.aitem{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:6px;font-size:12.5px;cursor:pointer}
.aitem[aria-selected=true]{background:var(--sel)}
.aitem .hintk{margin-left:auto;color:var(--mut);font-size:11px}
.aitem.danger{color:var(--danger)}
.toasts{position:absolute;top:56px;right:12px;display:flex;flex-direction:column;gap:6px;z-index:40;align-items:flex-end;pointer-events:none}
.toast{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:7px 11px;font-size:12.5px;
  box-shadow:0 10px 26px rgba(0,0,0,.4);animation:tin .16s ease-out}
.toast.mut{color:var(--mut)}
@keyframes tin{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.modal{position:absolute;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:50}
[data-theme=light] .modal{background:rgba(0,0,0,.22)}
.dlg{width:330px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:0 20px 50px rgba(0,0,0,.5)}
.dlg h3{margin:0 0 6px;font-size:13.5px;font-weight:600}
.dlg p{margin:0 0 12px;color:var(--mut);font-size:12px}
.dlg label{display:flex;gap:7px;align-items:center;color:var(--mut);font-size:12px;margin-bottom:14px}
.dlg .btns{display:flex;gap:8px;justify-content:flex-end}
.dbtn{font:inherit;font-size:12.5px;padding:5px 11px;border-radius:7px;cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--fg)}
.dbtn.red{background:var(--danger);border-color:var(--danger);color:#fff}

/* ---------- flow ---------- */
.flow{margin:32px auto 0;max-width:940px}
.flow h2{font-size:13px;font-weight:600;margin:0 0 8px;color:var(--fg)}
.flow .note{color:var(--mut);font-size:11.5px;margin:0 0 10px}
#flow{display:block;width:100%;border:1px solid var(--line);border-radius:10px;background:var(--panel)}

/* ---------- switcher ---------- */
.switcher{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);display:flex;align-items:center;gap:4px;
  background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:5px 6px;
  box-shadow:0 12px 34px rgba(0,0,0,.45);z-index:100}
.switcher button{background:transparent;border:0;color:var(--fg);font:inherit;font-size:12.5px;padding:6px 10px;border-radius:999px;cursor:pointer}
.switcher button:hover{background:var(--panel2)}
.switcher .cur{min-width:230px;text-align:center;font-weight:600}
.switcher .cur em{font-style:normal;color:var(--mut);font-weight:400;margin-left:6px}
.swnote{position:fixed;left:50%;bottom:2px;transform:translateX(-50%);color:var(--mut);font-size:10.5px;z-index:100}
@media (prefers-reduced-motion: reduce){
  .hl{transition:opacity .12s}
  .prog,.prog.run{transition:opacity .12s}
  .toast{animation:none}
  .switcher,.swnote{transition:none}
}
</style>
</head>
<body>
<div class="page">
  <div class="phead">
    <div>
      <h1>Raycast 进程监视器 · 交互变体投票</h1>
      <p class="lede">这是一次性对比页，不是扩展本身——Raycast 扩展不能自定义 CSS，所以最终长相由 <code>@raycast/api</code> 的 <code>List</code> 决定；这里只比「结构 + 交互」。</p>
      <p class="hint">键盘：<b>↑/↓</b> 选行 · <b>↵ / ⌘↵</b> 见底栏 · <b>←/→</b> 切换变体（在可展开行上 → 用于展开 Helper）· <b>1/2/3</b> 或 <b>A/B/C</b> · <b>⌘K</b> 动作 · <b>⌘P</b> 分类/排序 · <b>Esc</b> 返回</p>
    </div>
    <div class="pctrl">
      <button class="pbtn" id="btnLang">EN</button>
      <button class="pbtn" id="btnTheme">浅色</button>
    </div>
  </div>
  <ul class="vlist" id="vlist"></ul>

  <div class="stage">
    <div class="win" id="win" role="dialog" aria-label="Raycast 进程监视器原型">
      <div class="winbar"><div class="prog" id="prog"></div></div>
      <div class="searchrow">
        <span class="mag"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20.5 20.5 16.5 16.5"/></svg></span>
        <input id="q" type="text" autocomplete="off" spellcheck="false">
        <button class="ddbtn" id="ddbtn"><span id="ddlab"></span><span class="chev">▾</span></button>
      </div>
      <div class="body">
        <div class="listpane"><div class="list" id="list" role="listbox" tabindex="0"><div class="hl" id="hl"></div><div id="rows"></div></div></div>
        <aside class="detail" id="detail" hidden></aside>
      </div>
      <div class="foot" id="foot"></div>
      <div class="menu" id="menu" hidden></div>
      <div class="apanel" id="apanel" hidden></div>
      <div class="toasts" id="toasts"></div>
      <div class="modal" id="modal" hidden></div>
    </div>
  </div>

  <div class="flow">
    <h2 id="flowTitle"></h2>
    <p class="note" id="flowNote"></p>
    <canvas id="flow"></canvas>
  </div>
</div>

<div class="switcher">
  <button id="swPrev" aria-label="上一个变体">←</button>
  <button class="cur" id="swCur"></button>
  <button id="swNext" aria-label="下一个变体">→</button>
</div>
<div class="swnote" id="swNote"></div>

/* ============================ state ============================ */
const P = new URLSearchParams(location.search);
const S = {
  variant: ((P.get('variant') || 'A').toUpperCase().match(/[ABC]/) || ['A'])[0],
  lang: P.get('lang') === 'en' ? 'en' : 'zh',
  theme: P.get('theme') === 'light' ? 'light' : 'dark',
  q: '', cat: 'all', sort: 'cpu',
  view: 'list', helperApp: null,
  selId: null, curIdx: 0,
  menu: null, menuIdx: 0,
  apanel: false, api: 0,
  confirm: null, remember: false, noAsk: false,
  toastId: 0,
};
const CATS = ['all','ui','cpu','mem','net','bg'];
const SORTS = ['cpu','mem','name'];
const $ = (s) => document.querySelector(s);
const listEl = $('#list'), rowsEl = $('#rows'), detailEl = $('#detail'), footEl = $('#foot'),
      menuEl = $('#menu'), apanelEl = $('#apanel'), modalEl = $('#modal'), toastsEl = $('#toasts');

function syncURL(){
  P.set('variant', S.variant); P.set('lang', S.lang); P.set('theme', S.theme);
  history.replaceState(null, '', location.pathname + '?' + P.toString());
}
function fmtMem(mb){ return mb >= 1000 ? (mb / 1024).toFixed(1) + ' GB' : Math.round(mb) + ' MB'; }
function sub(a){
  const bits = [];
  if (a.sip) bits.push(t('sip'));
  else {
    if (a.helpers.length) bits.push(t('helpers', { n: a.helpers.length }));
    if (a.port) bits.push(t('port', { p: a.port }));
    if (a.nettop) bits.push(t('nettop'));
    if (!bits.length) bits.push(S.lang === 'zh' ? '无 Helper' : 'no helpers');
  }
  return bits.join(' · ');
}

/* ============================ order / filtering ============================ */
let order = [];
function recomputeOrder(){
  order = APPS.slice().sort((a, b) => {
    if (S.sort === 'mem') return b.mem - a.mem;
    if (S.sort === 'name') return a.name[S.lang].localeCompare(b.name[S.lang]);
    return b.cpu - a.cpu;
  });
}
function filtered(){
  const q = S.q.trim().toLowerCase();
  return order.filter(a => {
    if (S.variant !== 'C' && S.cat !== 'all' && !a.tags.includes(S.cat)) return false;
    if (!q) return true;
    const hay = [a.name.zh, a.name.en, a.pid, a.port || '', a.helpers.map(h => h.n).join(' ')].join(' ').toLowerCase();
    return hay.includes(q);
  });
}
function sections(){
  const arr = filtered();
  if (S.variant !== 'C') return [{ key: '', apps: arr }];
  return [
    { key: 'high', apps: arr.filter(a => a.cpu >= 5) },
    { key: 'win',  apps: arr.filter(a => a.tags.includes('ui')) },
    { key: 'bg',   apps: arr.filter(a => a.tags.includes('bg')) },
  ].filter(g => g.apps.length);
}
function navRows(){
  if (S.view === 'helpers'){
    const a = APPS.find(x => x.id === S.helperApp);
    return a ? a.helpers.map(h => ({ id: a.id + '#' + h.pid, app: a, helper: h })) : [];
  }
  return sections().flatMap(g => g.apps.map(a => ({ id: a.id, app: a })));
}
function currentRow(){
  const r = navRows();
  if (!r.length) return null;
  let i = -1;
  if (S.selId) i = r.findIndex(x => x.id === S.selId);
  if (i < 0) i = Math.min(Math.max(S.curIdx, 0), r.length - 1);
  S.curIdx = i; S.selId = r[i].id;
  return r[i];
}
function move(d){
  const r = navRows();
  if (!r.length) return;
  const i = Math.min(r.length - 1, Math.max(0, currentRow() ? S.curIdx + d : (d > 0 ? 0 : r.length - 1)));
  S.curIdx = i; S.selId = r[i].id; S.needScroll = true; render();
}

/* ============================ actions ============================ */
function toast(msg, mut){
  const id = ++S.toastId;
  S.toasts = S.toasts || [];
  S.toasts.push({ id, msg, mut });
  renderToasts();
  setTimeout(() => { S.toasts = S.toasts.filter(x => x.id !== id); renderToasts(); }, 2400);
}
function renderToasts(){
  toastsEl.innerHTML = (S.toasts || []).map(x => `<div class="toast${x.mut ? ' mut' : ''}">${esc(x.msg)}</div>`).join('');
}
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c])); }
function flashProgress(){ const p = $('#prog'); p.classList.add('run'); clearTimeout(p._t); p._t = setTimeout(() => p.classList.remove('run'), 420); }

function killApp(app, force){
  if (app.sip){ toast(t('toast.sip'), true); return; }
  const i = APPS.indexOf(app);
  if (i < 0) return;
  const idx = S.curIdx;
  APPS.splice(i, 1);
  S.view = 'list'; S.helperApp = null;
  recomputeOrder();
  const r = navRows();
  S.curIdx = Math.min(idx, Math.max(0, r.length - 1));
  S.selId = r.length ? r[S.curIdx].id : null;
  toast(force ? t('toast.force', { n: app.sn ? app.sn[S.lang] : app.name[S.lang] }) : t('toast.kill', { n: app.sn ? app.sn[S.lang] : app.name[S.lang] }));
  render();
}
function killHelper(app, h){
  const i = app.helpers.indexOf(h);
  if (i < 0) return;
  app.helpers.splice(i, 1);
  const r = navRows();
  if (!r.length){ S.view = 'list'; S.selId = app.id; }
  else { S.curIdx = Math.min(S.curIdx, r.length - 1); S.selId = r[S.curIdx].id; }
  toast(t('toast.helper', { n: h.n }));
  render();
}
function requestForce(app){
  if (app.sip){ toast(t('toast.sip'), true); return; }
  if (S.noAsk){ killApp(app, true); return; }
  S.remember = false; S.confirm = app.id; render();
}
function primaryAction(){
  const row = currentRow();
  if (!row) return;
  if (row.helper){ killHelper(row.app, row.helper); return; }
  const app = row.app;
  if (app.sip){ toast(t('toast.sip'), true); return; }
  if (S.variant === 'B'){ S.apanel = true; S.api = 0; render(); return; }
  killApp(app, false);
}
function forceAction(){
  const row = currentRow();
  if (!row || row.helper) return;
  requestForce(row.app);
}
function actionItems(){
  const row = currentRow();
  if (!row) return [];
  const app = row.app;
  const items = [
    { k: 'path', l: t('ap.path'), hint: '↵' },
    { k: 'copy', l: t('ap.copy'), hint: '' },
    { k: 'kill', l: t('ap.kill'), hint: '⌘↵', danger: false },
  ];
  if (S.variant === 'C') items.push({ k: 'force', l: t('ap.danger'), hint: '⌘↵', danger: true });
  return items.map(i => Object.assign(i, { app }));
}
function runAction(item){
  S.apanel = false;
  const app = item.app;
  if (item.k === 'path') toast(t('toast.path', { n: app.path }));
  else if (item.k === 'copy') toast(t('toast.copy', { n: app.pid }));
  else if (item.k === 'kill') killApp(app, false);
  else if (item.k === 'force') requestForce(app);
  render();
}
function menuItems(){
  return S.variant === 'C'
    ? SORTS.map(k => ({ v: k, l: t('sort.' + k) }))
    : CATS.map(k => ({ v: k, l: t('cat.' + k) }));
}
function menuValue(){ return S.variant === 'C' ? S.sort : S.cat; }
function pickMenu(v){
  if (S.variant === 'C'){ S.sort = v; recomputeOrder(); } else { S.cat = v; }
  S.menu = null; flashProgress(); render();
}
function toggleHelpers(app){
  if (!app || !app.helpers.length || app.sip) return;
  S.view = 'helpers'; S.helperApp = app.id; S.selId = app.id + '#' + app.helpers[0].pid; S.curIdx = 0;
  S.needScroll = true; render();
}
function backToList(){
  if (S.view !== 'helpers') return;
  const appId = S.helperApp;
  S.view = 'list'; S.helperApp = null; S.selId = appId;
  render();
}

/* ============================ render ============================ */
let renderQueued = false;
function render(){
  if (renderQueued) return;
  renderQueued = true;
  requestAnimationFrame(() => { renderQueued = false; doRender(); });
}
function doRender(){
  document.documentElement.dataset.theme = S.theme;
  document.documentElement.lang = S.lang === 'zh' ? 'zh-CN' : 'en';
  $('#q').placeholder = t('search');
  if ($('#q').value !== S.q) $('#q').value = S.q;
  $('#ddbtn').title = S.variant === 'C' ? t('hint.sort') : t('hint.cat');
  $('#ddlab').textContent = S.variant === 'C' ? t('sort.' + S.sort) : t('cat.' + S.cat);
  renderHeader();
  currentRow();
  renderList();
  renderDetail();
  renderFoot();
  renderMenu();
  renderAPanel();
  renderModal();
  renderSwitcher();
  drawFlow();
}
function renderHeader(){
  $('#btnLang').textContent = S.lang === 'zh' ? 'EN' : '中文';
  $('#btnTheme').textContent = S.theme === 'dark' ? (S.lang === 'zh' ? '浅色' : 'Light') : (S.lang === 'zh' ? '深色' : 'Dark');
  $('#vlist').innerHTML = ['A','B','C'].map(v => {
    const key = v.toLowerCase();
    return `<li data-v="${v}" aria-current="${S.variant === v}"><b>${esc(t('v.' + key + '.t'))}</b>` +
      `<span>${esc(t('v.' + key + '.d'))}</span>${v === 'A' ? `<em>${esc(t('recommended'))}</em>` : ''}</li>`;
  }).join('');
}
function iconHtml(a){
  return `<span class="icon" style="background:${a.col}">${esc(a.ic)}</span>`;
}
function rowHtml(app, opts){
  const sel = S.selId === app.id ? ' sel' : '';
  const sip = app.sip ? ' sip' : '';
  const acc = opts.acc
    ? `<span class="acc"><span class="cpu">${app.cpu.toFixed(1)}%</span><span class="mem">${fmtMem(app.mem)}</span></span>` : '';
  const exp = (opts.expand && app.helpers.length && !app.sip)
    ? `<button class="expand" data-exp="${app.id}" title="${esc(t('breadcrumb'))}" aria-label="${esc(t('breadcrumb'))}">›</button>` : '';
  return `<div class="row${sel}${sip}" data-id="${app.id}" role="option" aria-selected="${!!sel}">
    ${iconHtml(app)}<span class="meta"><span class="t">${esc(app.name[S.lang])}</span><span class="s">${esc(sub(app))}</span></span>${acc}${exp}</div>`;
}
function renderList(){
  const sp = listEl.scrollTop;
  const rows = navRows();
  const acc = S.variant !== 'B';
  let html = '';
  if (S.view === 'helpers'){
    const app = APPS.find(a => a.id === S.helperApp);
    html += `<div class="crumb"><button data-back="1">‹ ${esc(t('back'))}</button> <b>${esc(app ? app.name[S.lang] : '')}</b> <span>· ${esc(t('breadcrumb'))}</span></div>`;
    html += app ? app.helpers.map(h => {
      const sel = S.selId === app.id + '#' + h.pid ? ' sel' : '';
      return `<div class="row${sel}" data-hid="${h.pid}" data-id="${app.id}#${h.pid}" role="option" aria-selected="${!!sel}">
        <span class="icon" style="background:${app.col};opacity:.65">${esc((h.n[0] || '?').toUpperCase())}</span>
        <span class="meta"><span class="t">${esc(h.n)}</span><span class="s">PID ${h.pid}</span></span>
        <span class="acc"><span class="cpu">${h.cpu.toFixed(1)}%</span><span class="mem">${fmtMem(h.mem)}</span></span></div>`;
    }).join('') : '';
  } else if (!rows.length){
    html += `<div class="empty">${esc(t('empty'))}<br><span style="font-size:11.5px">${esc(t('empty2'))}</span></div>`;
  } else {
    for (const g of sections()){
      if (g.key){
        html += `<div class="sec"><b>${esc(t('sec.' + g.key))}</b><span>${esc(t('sec.' + g.key + '.rule'))} · ${esc(t('running', { n: g.apps.length }))}</span></div>`;

      N('sort',16,96,140,46,'排序 Dropdown','Sort dropdown','muted','CPU / 内存 / 名称','CPU / memory / name'),
      N('sec',16,176,140,46,'三个 Section 同时渲染','Three sections at once','','高占用 / 有窗口 / 后台','high / windows / background'),
      N('sel',16,256,140,46,'选中行','Select row','','Section 内排序','sorted inside section'),
      N('enter',210,176,150,46,'Enter','Enter','accent','SIGTERM · 无确认','SIGTERM · no confirm'),
      N('rm',390,176,130,46,'行移除 + Toast','Row removed + toast','accent'),
      N('cmd',210,276,160,46,'⌘↵','⌘↵','danger','Danger zone 红色动作','red Danger zone action'),
      N('danger',400,276,150,46,'强制结束 · 红色','Force quit · red','danger'),
      N('ca',580,276,170,46,'confirmAlert · 记住选择','confirmAlert · remember','danger'),
      N('arrow',210,376,150,46,'→','→','','展开 Helper 子列表','helper sublist'),
      N('hk',390,376,150,46,'结束单个 Helper','Kill one helper'),
      N('note',580,376,250,46,'计数放 Section 标题副标题：High CPU · 3 running','Counts live in the section subtitle: High CPU · 3 running','note'),
    ],
    edges: [
      E('open','sort','v'), E('sort','sec','v'), E('sec','sel','v'),
      E('sel','enter','h'), E('enter','rm'),
      E('sel','cmd','h'), E('cmd','danger'), E('danger','ca'),
      E('sel','arrow','h'), E('arrow','hk'),
    ],
  },
};
const PAL = {
  dark:  { bg:'#1c1c1e', node:'#242426', stroke:'#3a3a3c', text:'#f2f2f7', mut:'#8e8e93', accent:'#FF6363', danger:'#ff453a', line:'#48484a', chip:'#1c1c1e' },
  light: { bg:'#ffffff', node:'#ffffff', stroke:'#d9d9de', text:'#1c1c1e', mut:'#6e6e73', accent:'#e8514f', danger:'#d8382f', line:'#c7c7cc', chip:'#ffffff' },
};
const DESIGN_W = 940, DESIGN_H = 510;
function drawFlow(){
  const cv = $('#flow');
  const w = cv.clientWidth || DESIGN_W;
  const s = w / DESIGN_W;
  const h = Math.round(DESIGN_H * s);
  const dpr = window.devicePixelRatio || 1;
  cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
  cv.style.height = h + 'px';
  const g = cv.getContext('2d');
  const c = PAL[S.theme];
  g.setTransform(dpr * s, 0, 0, dpr * s, 0, 0);
  g.clearRect(0, 0, DESIGN_W, DESIGN_H);
  g.fillStyle = c.bg; g.fillRect(0, 0, DESIGN_W, DESIGN_H);
  const f = FLOW[S.variant];
  const byId = {}; f.nodes.forEach(n => byId[n.id] = n);
  function anchor(n, side){
    if (side === 'r') return [n.x + n.w, n.y + n.h / 2];
    if (side === 'l') return [n.x, n.y + n.h / 2];
    if (side === 'b') return [n.x + n.w / 2, n.y + n.h];
    return [n.x + n.w / 2, n.y];
  }
  function stateColor(n){ return n.k === 'danger' ? c.danger : n.k === 'accent' ? c.accent : c.line; }
  function drawEdge(e){
    const a = byId[e.a], b = byId[e.b];
    if (!a || !b) return;
    const col = stateColor(b);
    let pts, arrow;
    if (e.m === 'v'){ pts = [anchor(a, 'b'), anchor(b, 't')]; arrow = 'b'; }
    else if (e.m === 'bt'){
      const p1 = anchor(a, 'b'), y = b.y - 26;
      pts = [p1, [p1[0], y], [b.x + b.w / 2, y], [b.x + b.w / 2, b.y]]; arrow = 'b';
    } else {
      const p1 = anchor(a, 'r'), p2 = anchor(b, 'l');
      if (Math.abs(p1[1] - p2[1]) < 1) pts = [p1, p2];
      else { const mx = (p1[0] + p2[0]) / 2; pts = [p1, [mx, p1[1]], [mx, p2[1]], p2]; }
      arrow = 'r';
    }
    g.strokeStyle = col; g.lineWidth = 1.4; g.setLineDash(e.dashed ? [4, 3] : []);
    g.beginPath(); g.moveTo(pts[0][0], pts[0][1]);
    for (let i = 1; i < pts.length; i++) g.lineTo(pts[i][0], pts[i][1]);
    g.stroke(); g.setLineDash([]);
    g.fillStyle = col;
    if (arrow !== 'b'){ g.beginPath(); g.moveTo(pts[pts.length - 1][0], pts[pts.length - 1][1]);
      g.lineTo(pts[pts.length - 1][0] - 7, pts[pts.length - 1][1] - 4); g.lineTo(pts[pts.length - 1][0] - 7, pts[pts.length - 1][1] + 4); g.closePath(); }
    else { g.beginPath(); g.moveTo(pts[pts.length - 1][0], pts[pts.length - 1][1]);
      g.lineTo(pts[pts.length - 1][0] - 4, pts[pts.length - 1][1] - 7); g.lineTo(pts[pts.length - 1][0] + 4, pts[pts.length - 1][1] - 7); g.closePath(); }
    g.fill();
    if (e.l){
      const mid = pts.length > 2 ? [(pts[0][0] + pts[1][0]) / 2, (pts[0][1] + pts[1][1]) / 2]
                                 : [(pts[0][0] + pts[1][0]) / 2, (pts[0][1] + pts[1][1]) / 2];
      const txt = L(e.l);
      g.font = '500 11px -apple-system,"PingFang SC",system-ui,sans-serif';
      const tw = g.measureText(txt).width;
      g.fillStyle = c.chip;
      g.fillRect(mid[0] - tw / 2 - 3, mid[1] - 8, tw + 6, 15);
      g.fillStyle = c.mut; g.textAlign = 'center'; g.textBaseline = 'middle';
      g.fillText(txt, mid[0], mid[1]);
    }
  }
  function drawNode(n){
    const isNote = n.k === 'note', isMuted = n.k === 'muted';
    g.beginPath();
    const r = 8, x = n.x, y = n.y, w2 = n.w, h2 = n.h;
    g.moveTo(x + r, y); g.arcTo(x + w2, y, x + w2, y + h2, r); g.arcTo(x + w2, y + h2, x, y + h2, r);
    g.arcTo(x, y + h2, x, y, r); g.arcTo(x, y, x + w2, y, r); g.closePath();
    g.fillStyle = isNote ? 'transparent' : c.node; g.fill();
    g.lineWidth = 1.2;
    if (isMuted || isNote){ g.setLineDash([4, 3]); g.strokeStyle = c.line; }
    else { g.strokeStyle = n.k === 'danger' ? c.danger : n.k === 'accent' ? c.accent : c.stroke; }
    g.stroke(); g.setLineDash([]);
    const titleCol = n.k === 'danger' ? c.danger : n.k === 'accent' ? c.accent : isMuted || isNote ? c.mut : c.text;
    g.textAlign = 'left'; g.textBaseline = 'middle';
    const hasSub = !!n.s;
    g.font = '600 12.5px -apple-system,"PingFang SC",system-ui,sans-serif';
    g.fillStyle = titleCol;
    g.fillText(L(n.t), n.x + 11, n.y + (hasSub ? n.h / 2 - 8 : n.h / 2));
    if (hasSub){
      g.font = '400 11px -apple-system,"PingFang SC",system-ui,sans-serif';
      g.fillStyle = c.mut;
      g.fillText(L(n.s), n.x + 11, n.y + n.h / 2 + 9);
    }
  }
  g.save(); g.translate(0, 44);
  f.edges.forEach(drawEdge);
  f.nodes.forEach(drawNode);
  g.restore();
  const title = S.variant + ' · ' + VNAMES[S.variant][S.lang];
  g.font = '600 13px -apple-system,"PingFang SC",system-ui,sans-serif';
  g.fillStyle = c.text; g.textAlign = 'left'; g.textBaseline = 'middle';
  g.fillText(title, 16, 24);
  g.font = '400 11px -apple-system,"PingFang SC",system-ui,sans-serif';
  g.fillStyle = c.mut;
  g.textAlign = 'right';
  g.fillText(S.lang === 'zh' ? '打开 Raycast → 结束进程' : 'open Raycast → process gone', DESIGN_W - 16, 24);
}

/* ============================ events ============================ */
document.addEventListener('keydown', (e) => {
  const k = e.key;
  const inInput = e.target && e.target.id === 'q';
  const meta = e.metaKey || e.ctrlKey;

  if (k === 'Escape'){
    if (S.confirm){ S.confirm = null; render(); e.preventDefault(); return; }
    if (S.menu){ S.menu = null; render(); e.preventDefault(); return; }
    if (S.apanel){ S.apanel = false; render(); e.preventDefault(); return; }
    if (S.view === 'helpers'){ backToList(); e.preventDefault(); return; }
    if (S.q){ S.q = ''; render(); e.preventDefault(); }
    return;
  }
  if (S.confirm){
    if (k === 'Enter'){
      const a = APPS.find(x => x.id === S.confirm);
      const rem = S.remember;
      S.confirm = null;
      if (rem) S.noAsk = true;
      if (a) killApp(a, true);
      e.preventDefault();
    }
    return;
  }
  if (meta && k.toLowerCase() === 'k'){ S.apanel = !S.apanel; S.api = 0; render(); e.preventDefault(); return; }
  if (meta && k.toLowerCase() === 'p'){ S.menu = S.menu ? null : 'x'; S.menuIdx = Math.max(0, menuItems().findIndex(i => i.v === menuValue())); render(); e.preventDefault(); return; }
  if (meta && k.toLowerCase() === 'i'){ if (S.variant === 'B'){ render(); } e.preventDefault(); return; }
  if (meta && k === 'Enter'){ forceAction(); e.preventDefault(); return; }

  if (S.apanel){
    const items = actionItems();
    if (k === 'ArrowDown' || k === 'ArrowUp'){ S.api = (S.api + (k === 'ArrowDown' ? 1 : items.length - 1)) % items.length; render(); e.preventDefault(); return; }
    if (k === 'Enter' && items[S.api]){ runAction(items[S.api]); e.preventDefault(); return; }
  }
  if (S.menu){
    const items = menuItems();
    if (k === 'ArrowDown' || k === 'ArrowUp'){ S.menuIdx = (S.menuIdx + (k === 'ArrowDown' ? 1 : items.length - 1)) % items.length; render(); e.preventDefault(); return; }
    if (k === 'Enter'){ pickMenu(items[S.menuIdx].v); e.preventDefault(); return; }
  }
  if (inInput && (k === 'ArrowLeft' || k === 'ArrowRight')) return;

  if (k === 'ArrowDown' || k === 'ArrowUp'){
    if (k === 'ArrowDown' && inInput){ $('#list').focus(); }
    move(k === 'ArrowDown' ? 1 : -1); e.preventDefault(); return;
  }
  if (k === 'ArrowRight'){
    const row = currentRow();
    if (S.variant !== 'B' && S.view === 'list' && row && row.app.helpers.length && !row.app.sip){ toggleHelpers(row.app); }
    else if (S.view === 'helpers'){ /* stay */ }
    else { setVariant(S.variant === 'C' ? 'A' : String.fromCharCode(S.variant.charCodeAt(0) + 1)); }
    e.preventDefault(); return;
  }
  if (k === 'ArrowLeft'){
    if (S.view === 'helpers'){ backToList(); }
    else { setVariant(S.variant === 'A' ? 'C' : String.fromCharCode(S.variant.charCodeAt(0) - 1)); }
    e.preventDefault(); return;
  }
  if (k === 'Enter'){
    const row = currentRow();
    if (row && row.helper){ killHelper(row.app, row.helper); }
    else primaryAction();
    e.preventDefault(); return;
  }
  if (!inInput && /^[abc]$/i.test(k)){ setVariant(k.toUpperCase()); e.preventDefault(); return; }
  if (!inInput && /^[123]$/.test(k)){ setVariant(['A','B','C'][+k - 1]); e.preventDefault(); return; }
});
$('#q').addEventListener('input', (e) => { S.q = e.target.value; S.curIdx = 0; S.selId = null; render(); });
$('#q').addEventListener('keydown', (e) => { if (e.key === 'Escape'){ e.target.blur(); } });
$('#ddbtn').addEventListener('click', () => { S.menu = S.menu ? null : 'x'; S.menuIdx = Math.max(0, menuItems().findIndex(i => i.v === menuValue())); render(); });
listEl.addEventListener('click', (e) => {
  const back = e.target.closest('[data-back]');
  if (back){ backToList(); return; }
  const exp = e.target.closest('[data-exp]');
  if (exp){ const a = APPS.find(x => x.id === exp.dataset.exp); toggleHelpers(a); return; }
  const hrow = e.target.closest('[data-hid]');
  if (hrow){
    const a = APPS.find(x => x.id === S.helperApp);
    const i = a.helpers.findIndex(h => String(h.pid) === hrow.dataset.hid);
    S.curIdx = i; S.selId = a.id + '#' + hrow.dataset.hid; S.needScroll = false; render(); return;
  }
  const row = e.target.closest('.row[data-id]');
  if (row){
    S.selId = row.dataset.id;
    S.curIdx = Math.max(0, navRows().findIndex(x => x.id === S.selId));
    render();
  }
});
listEl.addEventListener('dblclick', (e) => { const row = e.target.closest('.row[data-id]'); if (row) primaryAction(); });
menuEl.addEventListener('click', (e) => { const it = e.target.closest('[data-mv]'); if (it) pickMenu(it.dataset.mv); });
apanelEl.addEventListener('click', (e) => { const it = e.target.closest('[data-ai]'); if (it) runAction(actionItems()[+it.dataset.ai]); });
modalEl.addEventListener('click', (e) => {
  if (e.target === modalEl){ S.confirm = null; render(); return; }
  if (e.target.id === 'chkNoAsk'){ S.remember = e.target.checked; return; }
  const b = e.target.closest('[data-conf]');
  if (!b) return;
  if (b.dataset.conf === '0'){ S.confirm = null; render(); return; }
  const a = APPS.find(x => x.id === S.confirm);
  const rem = S.remember; S.confirm = null;
  if (rem) S.noAsk = true;
  if (a) killApp(a, true);
});
$('#btnLang').addEventListener('click', () => {
  S.lang = S.lang === 'zh' ? 'en' : 'zh'; recomputeOrder(); syncURL(); render();
});
$('#btnTheme').addEventListener('click', () => { S.theme = S.theme === 'dark' ? 'light' : 'dark'; syncURL(); render(); });
$('#swPrev').addEventListener('click', () => setVariant(S.variant === 'A' ? 'C' : String.fromCharCode(S.variant.charCodeAt(0) - 1)));
$('#swNext').addEventListener('click', () => setVariant(S.variant === 'C' ? 'A' : String.fromCharCode(S.variant.charCodeAt(0) + 1)));
$('#vlist').addEventListener('click', (e) => { const li = e.target.closest('li[data-v]'); if (li) setVariant(li.dataset.v); });
window.addEventListener('resize', () => drawFlow());

/* ============================ tick: fake refresh ============================ */
setInterval(() => {
  for (const a of APPS){
    a.cpu = Math.max(0.1, +(a.cpu + (Math.random() - 0.5) * 0.9).toFixed(1));
    a.mem = Math.max(20, Math.round(a.mem + (Math.random() - 0.5) * 12));
    for (const h of a.helpers){
      h.cpu = Math.max(0, +(h.cpu + (Math.random() - 0.5) * 0.5).toFixed(1));
      h.mem = Math.max(8, Math.round(h.mem + (Math.random() - 0.5) * 8));
    }
  }
  render();
}, 2000);

/* ============================ boot ============================ */
recomputeOrder();
const first = navRows();
S.selId = first.length ? first[0].id : null;
syncURL();
render();
window.addEventListener('load', drawFlow);
</script>
