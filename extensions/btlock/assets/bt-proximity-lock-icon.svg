<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1D4ED8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="lockGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E0E7FF;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="256" cy="256" r="256" fill="url(#bgGrad)"/>
  
  <!-- Bluetooth symbol (stylized) -->
  <g transform="translate(256, 256)">
    <!-- Main Bluetooth shape -->
    <path d="M -45 -160 L 105 -65 L -45 40 L -45 160 L 105 65 L -45 -40 L -45 -160 Z" 
          fill="white" 
          opacity="0.95"
          stroke="white" 
          stroke-width="14" 
          stroke-linejoin="round"/>
  </g>
  
  <!-- Lock icon overlay (bottom right) -->
  <g transform="translate(370, 370)">
    <!-- Lock shackle -->
    <path d="M -40 -20 L -40 -50 Q -40 -80 -5 -80 Q 30 -80 30 -50 L 30 -20" 
          fill="none" 
          stroke="url(#lockGrad)" 
          stroke-width="22" 
          stroke-linecap="round"/>
    
    <!-- Lock body -->
    <rect x="-60" y="-20" width="120" height="95" rx="14" 
          fill="url(#lockGrad)"/>
    
    <!-- Lock keyhole -->
    <circle cx="-5" cy="25" r="15" fill="#3B82F6"/>
    <rect x="-12" y="25" width="14" height="28" rx="4" fill="#3B82F6"/>
  </g>
  
  <!-- Subtle signal waves -->
  <g opacity="0.3">
    <path d="M 150 256 Q 150 200 200 200" 
          fill="none" 
          stroke="white" 
          stroke-width="6" 
          stroke-linecap="round"/>
    <path d="M 130 256 Q 130 180 200 180" 
          fill="none" 
          stroke="white" 
          stroke-width="6" 
          stroke-linecap="round"/>
  </g>
</svg>