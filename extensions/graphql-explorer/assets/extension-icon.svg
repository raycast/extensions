<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#3730A3"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Indigo rounded-square background -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#sheen)"/>

  <!-- Magnifier: lens + handle -->
  <circle cx="234" cy="234" r="118" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-width="30"/>
  <line x1="324" y1="324" x2="392" y2="392" stroke="#FFFFFF" stroke-width="46" stroke-linecap="round"/>

  <!-- Graph inside the lens: three connected nodes -->
  <g stroke="#FFFFFF" stroke-width="13" stroke-linejoin="round" fill="none">
    <polygon points="234,168 176.8,267 291.2,267"/>
  </g>
  <g fill="#FFFFFF">
    <circle cx="234" cy="168" r="22"/>
    <circle cx="176.8" cy="267" r="22"/>
    <circle cx="291.2" cy="267" r="22"/>
  </g>
</svg>
