instructions: |
  Link every post as a Markdown link, with a short title from its text and its url value as the target.
  A post ID or username comes from search-posts, search-users or a link the user gives. Never guess one.
  search-posts accepts X operators such as from: and since:.
  Creating a monitor costs 30 credits an hour while it is active. Say so before you create one.
  To delete a monitor, call list-monitors first, then pass its kind and id to delete-monitor.
  When a result has a nextCursor and the user wants more, call the same tool again with that cursor.
  To save the photos or videos of a post, call download-post-media and say where the files went.
evals:
  - input: "@xquik what did @NASA post last?"
    mocks:
      get-user-posts:
        posts:
          - id: "2102882545427714266"
            url: "https://x.com/NASA/status/2102882545427714266"
            text: "Meet Messier 106, a spiral galaxy with an extra set of arms."
            author: "NASA"
            createdAt: "Wed Sep 23 22:07:23 +0000 2026"
            likes: 9043
            reposts: 772
            replies: 207
            views: 1291231
    expected:
      - callsTool:
          name: "get-user-posts"
          arguments:
            user:
              includes: "NASA"
      - matches: "\\[[^\\]]+\\]\\(https://x\\.com/NASA/status/2102882545427714266\\)"
  - input: "@xquik find posts from NASA about Artemis since 2026-01-01"
    mocks:
      search-posts:
        posts:
          - id: "2102761519985332442"
            url: "https://x.com/NASA/status/2102761519985332442"
            text: "Artemis crews train for the Moon."
            author: "NASA"
            createdAt: "Wed Sep 23 14:06:28 +0000 2026"
            likes: 9775
            reposts: 1364
            replies: 271
            views: 962488
    expected:
      - callsTool:
          name: "search-posts"
          arguments:
            query:
              and:
                - includes: "from:NASA"
                - includes: "since:2026-01-01"
  - input: "@xquik does @NASA follow @SpaceX?"
    mocks:
      check-follow:
        isFollowing: false
        isFollowedBy: true
        sourceUsername: "nasa"
        targetUsername: "spacex"
    expected:
      - callsTool: "check-follow"
      - meetsCriteria: "Says NASA does not follow SpaceX"
  - input: "@xquik what is trending in Turkey?"
    mocks:
      get-trends:
        - name: "#AI"
          rank: 1
          posts: 250000
          url: "https://x.com/search?q=%23AI"
    expected:
      - callsTool:
          name: "get-trends"
          arguments:
            woeid: 23424969
      - includes: "#AI"
  - input: "@xquik show the profile of @NASA"
    mocks:
      get-profile:
        id: "11348282"
        username: "NASA"
        name: "NASA"
        url: "https://x.com/NASA"
        description: "Making the seemingly impossible, possible."
        followers: 92376194
        following: 115
        posts: 74336
    expected:
      - callsTool: "get-profile"
      - includes: "NASA"
  - input: "@xquik monitor @NASA for new posts"
    mocks:
      create-monitor:
        id: "42"
        target: "NASA"
        isActive: true
    expected:
      - callsTool:
          name: "create-monitor"
          arguments:
            kind: "account"
            target:
              includes: "NASA"
      - includes: "30 credits"
  - input: "@xquik find accounts named NASA"
    mocks:
      search-users:
        users:
          - id: "11348282"
            username: "NASA"
            name: "NASA"
            url: "https://x.com/NASA"
            followers: 92376194
        nextCursor: "next"
    expected:
      - callsTool:
          name: "search-users"
          arguments:
            query:
              includes: "NASA"
      - includes: "@NASA"
  - input: "@xquik who mentioned @NASA lately?"
    mocks:
      get-user-mentions:
        posts:
          - id: "2102990000000000001"
            url: "https://x.com/esa/status/2102990000000000001"
            text: "Congrats @NASA on the launch."
            author: "esa"
            createdAt: "Thu Sep 24 09:00:00 +0000 2026"
            likes: 1200
    expected:
      - callsTool:
          name: "get-user-mentions"
          arguments:
            user:
              includes: "NASA"
      - includes: "esa"
  - input: "@xquik read https://x.com/NASA/status/2102882545427714266"
    mocks:
      get-post:
        id: "2102882545427714266"
        url: "https://x.com/NASA/status/2102882545427714266"
        text: "Meet Messier 106, a spiral galaxy with an extra set of arms."
        author: "NASA"
        likes: 9043
    expected:
      - callsTool:
          name: "get-post"
          arguments:
            post:
              includes: "2102882545427714266"
      - includes: "Messier 106"
  - input: "@xquik show every reply to https://x.com/NASA/status/2102882545427714266"
    mocks:
      get-post-replies:
        posts:
          - id: "2102890000000000002"
            url: "https://x.com/astro_fan/status/2102890000000000002"
            text: "Beautiful image."
            author: "astro_fan"
            likes: 12
        nextCursor: "page-2"
    expected:
      - callsTool:
          name: "get-post-replies"
          arguments:
            post:
              includes: "2102882545427714266"
  - input: "@xquik save the video from https://x.com/NASA/status/2102882545427714266"
    mocks:
      download-post-media:
        saved: 1
        files:
          - "/Users/me/Downloads/xquik-2102882545427714266-0.mp4"
    expected:
      - callsTool:
          name: "download-post-media"
          arguments:
            post:
              includes: "2102882545427714266"
      - includes: "Downloads"
  - input: "@xquik show the thread of https://x.com/NASA/status/2102882545427714266"
    mocks:
      get-post-thread:
        posts:
          - id: "2102882545427714266"
            url: "https://x.com/NASA/status/2102882545427714266"
            text: "Meet Messier 106, a spiral galaxy with an extra set of arms."
            author: "NASA"
    expected:
      - callsTool:
          name: "get-post-thread"
          arguments:
            post:
              includes: "2102882545427714266"
  - input: "@xquik delete my keyword monitor for artemis launch"
    mocks:
      list-monitors:
        monitors:
          - kind: "keyword"
            id: "21"
            target: "artemis launch"
            isActive: true
            eventTypes:
              - "tweet.new"
      delete-monitor:
        deleted: true
        id: "21"
        target: "artemis launch"
    expected:
      - callsTool:
          name: "list-monitors"
          arguments:
            kind: "keyword"
      - callsTool:
          name: "delete-monitor"
          arguments:
            kind: "keyword"
            id: "21"
  - input: "@xquik what did my monitors catch today?"
    mocks:
      list-monitor-events:
        events:
          - id: "9"
            type: "New Post"
            occurredAt: "2026-11-03T08:00:00Z"
            username: "NASA"
            post:
              id: "2102882545427714266"
              url: "https://x.com/NASA/status/2102882545427714266"
              text: "Meet Messier 106, a spiral galaxy with an extra set of arms."
              author: "NASA"
    expected:
      - callsTool: "list-monitor-events"
      - includes: "NASA"
  - input: "@xquik list my account monitors"
    mocks:
      list-monitors:
        monitors:
          - kind: "account"
            id: "42"
            target: "@NASA"
            isActive: true
            eventTypes:
              - "tweet.new"
    expected:
      - callsTool:
          name: "list-monitors"
          arguments:
            kind: "account"
      - includes: "@NASA"
