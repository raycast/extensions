# git-cliff configuration for Raycast Store changelog entries.
# Only user-facing Conventional Commits (feat, fix, perf) become entries.
# See ADR-0009 and `npm run release`.

[changelog]
# The changelog title lives in CHANGELOG.md; `npm run release` inserts entries below it.
header = ""
body = """
## [{{ version | default(value="Unreleased") | trim_start_matches(pat="v") }}] - {PR_MERGE_DATE}
{% for group, commits in commits | group_by(attribute="group") %}
{%- for commit in commits %}
- {% if commit.breaking %}Breaking: {% endif %}{{ commit.message | upper_first }}
{%- endfor %}
{%- endfor %}
"""
footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = true
tag_pattern = "v[0-9].*"
sort_commits = "oldest"
commit_parsers = [
  { message = "^feat", group = "1. Features" },
  { message = "^fix", group = "2. Fixes" },
  { message = "^perf", group = "3. Performance" },
  { message = ".*", skip = true },
]

[bump]
features_always_bump_minor = true
breaking_always_bump_major = true
