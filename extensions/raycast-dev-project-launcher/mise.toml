[tools]
# 22+ is required by semantic-release; Raycast itself only needs 20+.
node = "22"

[tasks.install]
description = "Install dependencies"
run = "npm install"
sources = ["package.json", "package-lock.json"]
outputs = ["node_modules/.package-lock.json"]

[tasks.dev]
description = "Run ray develop (registers the extension in Raycast)"
depends = ["install"]
run = "npm run dev"

[tasks.build]
description = "Produce the production bundle in dist/"
depends = ["install"]
run = "npm run build"

[tasks.typecheck]
description = "tsc --noEmit"
depends = ["install"]
run = "npm run typecheck"

[tasks.lint]
description = "ray lint"
depends = ["install"]
run = "npm run lint"

[tasks.fix]
description = "ray lint --fix"
depends = ["install"]
run = "npm run fix-lint"

[tasks.check]
description = "typecheck + lint + build"
depends = ["typecheck", "lint", "build"]

[tasks.publish]
description = "Publish to the Raycast Store"
depends = ["install"]
run = "npm run publish"

[tasks.release]
description = "Run semantic-release (CI cuts the real release; use release-preview locally)"
depends = ["check"]
run = "npx semantic-release"

[tasks.release-preview]
description = "Show the version and notes semantic-release would produce, changing nothing"
depends = ["install"]
run = '''
set -eu
export GITHUB_TOKEN="${GITHUB_TOKEN:-$(gh auth token 2>/dev/null || true)}"
npx semantic-release --dry-run --no-ci
'''
