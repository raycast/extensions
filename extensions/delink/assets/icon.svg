<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 粉色到黄色渐变背景，左上到右下 -->
    <linearGradient id="bgGradient" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFB3C6"/>
      <stop offset="100%" stop-color="#FFE08A"/>
    </linearGradient>
    <!-- 图标内容用白色半透明，贴近 Raycast 风格 -->
  </defs>

  <!-- 背景：粉→黄渐变 -->
  <rect width="512" height="512" rx="112" fill="url(#bgGradient)"/>

  <!-- 左侧 { 括号：白色 -->
  <path d="M 180 120 C 140 120 120 148 120 180 L 120 230 C 120 248 108 256 96 256 C 108 256 120 264 120 282 L 120 332 C 120 364 140 392 180 392"
    stroke="white" stroke-width="36" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.9"/>

  <!-- 右侧 } 括号：白色 -->
  <path d="M 332 120 C 372 120 392 148 392 180 L 392 230 C 392 248 404 256 416 256 C 404 256 392 264 392 282 L 392 332 C 392 364 372 392 332 392"
    stroke="white" stroke-width="36" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.9"/>

  <!-- 中间斜线：白色略透明，形成层次感 -->
  <line x1="290" y1="148" x2="222" y2="364" stroke="white" stroke-width="36" stroke-linecap="round" opacity="0.65"/>
</svg>
